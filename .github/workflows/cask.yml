name: cask

# Keeps the Homebrew tap's cask in step with the published releases and proves
# the install on macOS (goal 0017). `harness/tools/cask-publish.ts` renders
# `.github/homebrew-cask-template.rb` with the release's own SHA-256 and, only
# on the push path, commits `Casks/pass-quest.rb` to wxxb789/homebrew-tap with
# the HOMEBREW_TAP_DEPLOY_KEY secret. `harness/tools/cask-install.ts` then
# installs that cask from the tap on a macOS runner and asserts it: no
# quarantine flag, the app boots through the smoke hook, uninstall quits the
# running app, --zap removes the bundle and every path the cask's zap trash:
# names, read from the installed cask file — and three mutant runs prove each of
# those three removals is caught, each installing its derived cask by name from
# a scratch tap created with `brew tap-new --no-git` on the runner (a cask
# cannot be installed from a path on current Homebrew).
#
# `workflow_dispatch` can start only a workflow whose file is on the default
# branch (GitHub registers a dispatchable workflow from the default branch), so
# a pull request touching the files below runs both jobs pre-merge: the v0.15.0
# dry run (never pushes, never reads the secret) and the tap install. After the
# merge, `gh workflow run cask.yml -f tag=... -f push=...` repeats it by hand.
# A published release runs it on its own; a draft or pre-release changes
# nothing (the event does not fire for drafts, and both the job guard and the
# tool refuse them).
on:
  pull_request:
    paths:
      - .github/workflows/cask.yml
      - .github/homebrew-cask-template.rb
      # The two cask tools and their repo-local import closure, read from the
      # tools themselves: a change to any file they load must re-run this
      # workflow, or a break in one of them would sit unnoticed until the next
      # release.
      - harness/lib/cask.ts
      - harness/lib/desktop.ts
      - harness/lib/desktop-page.ts
      - harness/lib/go.ts
      - harness/lib/hash.ts
      - harness/lib/json.ts
      - harness/lib/process.ts
      - harness/lib/repo.ts
      - harness/lib/types.ts
      - harness/gates/desktop-smoke/boot.ts
      - harness/gates/desktop-smoke/scenario.ts
      - harness/tools/cask-*.ts
      # `cask-publish.ts` reads the pinned render for its dry-run byte
      # comparison, so a change to it is a change to a file the tools load.
      - harness/gates/testdata/pass-quest-0.15.0.rb
      - mygo.json
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to render the cask from
        required: true
        default: v0.15.0
      push:
        description: Push the rendered cask to wxxb789/homebrew-tap
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: update the tap cask (dry run unless a release was published)
    if: ${{ github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Resolve the tag and the push flag
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_PUSH: ${{ github.event.inputs.push }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release) tag="$RELEASE_TAG"; push=true ;;
            workflow_dispatch) tag="$DISPATCH_TAG"; push="$DISPATCH_PUSH" ;;
            pull_request) tag="v0.15.0"; push=false ;;
            *) echo "::error::unexpected event $EVENT_NAME"; exit 1 ;;
          esac
          # The tag reaches no shell as text, but it does reach the tools; the
          # same three-number shape they require is enforced here too.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' does not look like v0.15.0"
            exit 1
          fi
          case "$push" in true|false) ;; *) echo "::error::push '$push' is not true or false"; exit 1 ;; esac
          echo "cask: event=$EVENT_NAME tag=$tag push=$push"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      # The pull request and dispatch-without-push path: render the release and
      # cross-check the digest, with no tap secret in the environment at all.
      # The tag travels in the environment, never inside the run: text from an
      # event must not be interpolated into a script (a tag like
      # `v1$(…)` would execute its command substitution before bun starts).
      - name: Dry run — render and cross-check, nothing pushed
        if: steps.mode.outputs.push != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: bun harness/tools/cask-publish.ts --tag "$TAG"

      # The pushed path: a published release, or a manual dispatch with
      # push=true. The deploy key exists only in this step's environment.
      - name: Push the tap cask
        if: steps.mode.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: bun harness/tools/cask-publish.ts --tag "$TAG" --push

  install:
    name: install from the tap (macOS)
    needs: update
    if: ${{ github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease) }}
    # `macos-26` is the floor the cask declares (`depends_on macos: :tahoe`,
    # goal 0017) and the tool asserts `sw_vers` as its first check, so a runner
    # below the floor says so instead of failing the install like a broken cask.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # Tap mode: the tap's own file, installed fully qualified (Homebrew
      # trusts only that item), audited last so the behavioural evidence is in
      # the log even when the audit finds something.
      - name: Install from the tap and assert every behaviour
        run: bun harness/tools/cask-install.ts

      # One mutant per assertion that could be vacuous: each writes the tap's
      # cask with one feature removed into a scratch `--no-git` tap, installs
      # it fully qualified, and fails the step unless the matching assertion
      # catches the removal.
      - name: "Mutant — no postflight_steps (the quarantine flag must survive)"
        run: bun harness/tools/cask-install.ts --mutant quarantine

      - name: "Mutant — no zap trash: (the data directory must survive)"
        run: bun harness/tools/cask-install.ts --mutant zap

      - name: "Mutant — no quit: (the app must survive the uninstall)"
        run: bun harness/tools/cask-install.ts --mutant quit
