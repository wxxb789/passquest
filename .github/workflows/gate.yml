name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Depth 2 keeps the clone shallow while leaving the pull request's base
      # commit reachable as HEAD^1, which the golden-contract gate diffs against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The desktop smoke launches a hidden MyGo window: WebKitGTK 4.1 (which pulls
      # in GTK 3) is loaded at window creation, and the runner has no display.
      # Its settings scenario stores a key through libsecret, which needs a
      # Secret Service on a D-Bus session bus: gnome-keyring provides one.
      - name: Install desktop webview prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb gnome-keyring libsecret-1-0 dbus-daemon

      - name: Install harness dependencies
        run: bun install --frozen-lockfile

      # macOS and Windows use the login keychain and the Credential Manager.
      - name: Gate
        if: runner.os != 'Linux'
        run: bun run gate

      # A private session bus with a keyring unlocked by a throwaway password, so
      # libsecret never prompts and nothing outlives the job.
      - name: Gate (D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets && bun run gate"
