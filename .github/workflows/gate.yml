name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per OS and gate group, so a failure costs one group's wall time and "Re-run failed jobs"
  # repeats only that group. `bun run gate --group` refuses to run unless this matrix lists exactly
  # the groups declared in harness/gates/index.ts and every gate is in one of them.
  gate:
    name: gate (${{ matrix.os }}, ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: [core, desktop, package, self-test]
    runs-on: ${{ matrix.os }}
    # The package job builds, installs and drives a real package, which takes
    # longer than a gate group that builds no package; every other group keeps
    # its 20.
    timeout-minutes: ${{ matrix.group == 'package' && 60 || 20 }}
    env:
      GATE_GROUP: ${{ matrix.group }}
    steps:
      # Depth 2 keeps the clone shallow while leaving the pull request's base
      # commit reachable as HEAD^1, which the golden-contract gate diffs against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The desktop smoke launches a hidden MyGo window: WebKitGTK 4.1 (which pulls
      # in GTK 3) is loaded at window creation, and the runner has no display.
      # Its settings scenario stores a key through libsecret, which needs a
      # Secret Service on a D-Bus session bus: gnome-keyring provides one.
      # The self-test feeds the desktop gates broken trees, so it needs the same.
      - name: Install desktop webview prerequisites
        if: runner.os == 'Linux' && matrix.group != 'core'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb gnome-keyring libsecret-1-0 dbus-daemon
          desktop-file-utils

      - name: Install harness dependencies
        run: bun install --frozen-lockfile

      # desktop-ux measures a 1280x800 and a 1440x844 page area and refuses any
      # other size (Q-0012-05). The Windows runner's display defaults to 1024x768,
      # which clamps the window; give it a display that can host both sizes.
      - name: Desktop display size
        if: runner.os == 'Windows' && matrix.group != 'core'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      # macOS and Windows use the login keychain and the Credential Manager. The
      # output is also kept for the artifact below, outside the checkout so no
      # working-tree gate reads it; bash's -o pipefail keeps the gate's exit status.
      - name: Gate
        if: runner.os != 'Linux' || matrix.group == 'core'
        shell: bash
        run: bun run gate --group "$GATE_GROUP" 2>&1 | tee "$RUNNER_TEMP/gate-output.log"

      # A private session bus with a keyring unlocked by a throwaway password, so
      # libsecret never prompts and nothing outlives the job.
      - name: Gate (D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux' && matrix.group != 'core'
        shell: bash
        run: >-
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets && bun run gate --group "$GATE_GROUP"'
          2>&1 | tee "$RUNNER_TEMP/gate-output.log"

      # A failed job keeps its full gate output, readable without a re-run.
      - name: Upload gate output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-output.log
          if-no-files-found: ignore
          retention-days: 14

      # The package this run built, kept short-lived beside the gate output:
      # an Actions artifact for inspection, never a release. It uploads after
      # the gate step even when that step failed, so a package that failed its
      # own smoke can be looked at without a re-run. The directories follow the
      # runner's architecture (build/darwin-arm64 or -amd64), and a missing
      # package fails this step rather than passing silently.
      - name: Upload package
        if: ${{ !cancelled() && matrix.group == 'package' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            build/windows-*/*-setup-*.exe
            build/darwin-*/*.dmg
            build/linux-*/*.AppImage
          if-no-files-found: error
          retention-days: 7
