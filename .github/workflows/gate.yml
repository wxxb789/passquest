name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Depth 2 keeps the clone shallow while leaving the pull request's base
      # commit reachable as HEAD^1, which the golden-contract gate diffs against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The desktop smoke launches a hidden MyGo window: WebKitGTK 4.1 (which pulls
      # in GTK 3) is loaded at window creation, and the runner has no display.
      - name: Install desktop webview prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb

      - name: Install harness dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun run gate
