    const mr=m.getBoundingClientRect();
    const items=[...m.querySelectorAll(':scope > .mnote[data-for]')].map(n=>{const a=document.getElementById(n.dataset.for);if(!a)return null;const rs=a.getClientRects();const r=rs[rs.length-1]||a.getBoundingClientRect();const r0=rs[0]||r;return {n,a,r,r0}}).filter(Boolean);
    items.sort((x,y)=>x.r0.top-y.r0.top);
    let y=0,lane=0;
    items.forEach(o=>{
      const isBlock=!/^(SPAN|SUP|MARK|B|I)$/.test(o.a.tagName);
      const lh=isBlock?(parseFloat(getComputedStyle(o.a).lineHeight)||22):o.r0.height;
      const hd=o.n.querySelector('.mh')||o.n.querySelector('p')||o.n;
      const hOff=Math.min(hd.getBoundingClientRect().height,26)/2; /* first-line midline of the note */
      const target=(o.r0.top-mr.top)+Math.min(lh,o.r0.height||lh)/2-hOff;
      const top=Math.max(target,y);o.n.style.top=top+'px';
      y=top+o.n.offsetHeight+(o.n.hasAttribute('data-soft')?10:18);
      if(!o.n.classList.contains('lead'))return;
      const k=o.n.classList.contains('k')?'k':'', opt=o.n.dataset.opt||'';
      const ya=o.r.top-lr.top+o.r.height*.58, xa=lineEnd(o.a,o.r)-lr.left+5;
      const yn=mr.top-lr.top+top+hOff, xn=mr.left-lr.left-6;
      let d;
      if(Math.abs(yn-ya)<3)d=`M${xa} ${ya} H${xn}`;
      else{const xl=Math.max(xa+8,xn-10-lane*12);lane++;d=`M${xa} ${ya} H${xl} V${yn} H${xn}`;}
      paths.push(`<path class="${k}" data-opt="${opt}" d="${d}"/><circle class="${k}" data-opt="${opt}" cx="${xa}" cy="${ya}" r="2"/>`);
    });
    m.style.minHeight=y+'px';
  });
  const svg=$('#leaders'); if(svg)svg.innerHTML=paths.join('');
}
function hot(L,on){document.querySelectorAll(`[data-opt="${L}"]`).forEach(e=>e.classList.toggle('hot',on));}

/* =====================================================================
   marks (practice)
   ===================================================================== */
function applyMarks(){
  const root=$('#passage'); if(!root)return;
  S.marks.forEach((m,i)=>{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){const at=n.nodeValue.indexOf(m);if(at>=0&&!n.parentNode.closest('mark')){
      const r=document.createRange();r.setStart(n,at);r.setEnd(n,at+m.length);const mk=document.createElement('mark');mk.className='pen';mk.id='mk-'+i;r.surroundContents(mk);break;}}
  });
}
function markSelection(){
  const sel=getSelection(); if(!sel||sel.isCollapsed)return false;
  const p=$('#passage'); if(!p||!p.contains(sel.anchorNode)||!p.contains(sel.focusNode))return false;
  const txt=sel.toString().trim(); if(!txt||txt.length>160)return false;
  if(sel.anchorNode!==sel.focusNode){toast(t('请在同一句里选择文字','Select words within one run of text'));return false;}
  S.marks.push(txt); sel.removeAllRanges(); render(); toast(t('已标记，可稍后做成 Anki 卡片','Marked — available for an Anki note later')); return true;
}

/* =====================================================================
   render + router (keeps keyboard focus across re-renders)
   ===================================================================== */
const VIEWS={today,practice,feedback,assess,report,anki,settings};
const FOCUS_KEYS=['data-mode','data-goto','data-ans','data-choose','data-act','data-w','data-ct','data-conf','data-annot','data-unmark','data-jump','id'];
function focusKey(el){
  if(!el||el===document.body||el.id==='main')return null;
  for(const a of FOCUS_KEYS)if(el.hasAttribute(a))return `[${a}="${CSS.escape(el.getAttribute(a))}"]`;
  return null;
}
let curRoute=null;
function render(){
  const r=route(), html=document.documentElement;
  const fk=layerOpen()?null:focusKey(document.activeElement);
  html.lang=S.lang==='zh'?'zh-Hans':'en'; html.dataset.theme=S.theme; html.dataset.route=r;
  document.title=`${META[r][S.lang]} — Pass Quest`;
  head(r); foot(r);
  const main=$('#main'), same=curRoute===r;
  const keepScroll=same?main.scrollTop:0;
  if(same)main.setAttribute('data-settled','');else main.removeAttribute('data-settled');
  main.innerHTML=VIEWS[r]();
  main.scrollTop=keepScroll;
  curRoute=r;
  if(r==='practice')applyMarks();
  layoutNotes(); requestAnimationFrame(layoutNotes);
  if(fk){const el=document.querySelector(fk);el&&el.focus({preventScroll:true});}
}
window.addEventListener('hashchange',()=>{closeLayers(false);S.skipAsk=false;S.revokeAsk=false;render();$('#main').focus({preventScroll:true});});
window.addEventListener('resize',layoutNotes);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutNotes);

function go(r){location.hash='#/'+r;}
function setTheme(v){S.theme=v||(S.theme==='light'?'dark':'light');persist();render();}
function setLang(v){S.lang=v||(S.lang==='zh'?'en':'zh');persist();render();}
function choose(L){S.choice=L;render();const el=document.querySelector(`[data-choose="${L}"]`);el&&el.focus({preventScroll:true});}
function resetAttempt(){S.choice=null;S.assisted=false;S.hintOpen=false;S.skipAsk=false;S.pClock=0;}
function submit(){if(!S.choice)return;S.answered=S.choice;S.answeredAt=S.pClock;S.answeredCond=S.assisted?'asst':'ind';resetAttempt();go('feedback');}
function setMode(m){
  if(S.coach===m&&!S.pending)return;
  S.coach=m;
  /* no consent → nothing is sent, nothing is spent */
  if(!S.consent){render();return;}
  if(!S.coachVisited[m]&&!S.shot){
    S.coachVisited[m]=true;S.pending=m;S.budget=Math.min(20,S.budget+1);render();
    setTimeout(()=>{if(S.pending===m){S.pending=null;render();}},900);
  } else {S.coachVisited[m]=true;if(S.pending&&S.pending!==m)S.pending=null;render();}
}
function aGo(n){const A=S.assess;if(n<1||n>40)return;A.cur=n;A.item=n===17?52:0;render();}
function aAns(L){const A=S.assess;if(A.to.has(A.cur))return;A.ans[A.cur]=L;render();}
const stub=(zh,en)=>()=>toast(t(zh,en));

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#scrim')){closeLayers();return;}
  const el=e.target.closest('[data-act],[data-choose],[data-mode],[data-goto],[data-ans],[data-close],[data-w],[data-ct],[data-conf],[data-annot],[data-unmark],[data-jump]');
  if(!el)return;
  if(el.dataset.choose){choose(el.dataset.choose);return;}
  if(el.dataset.mode){setMode(el.dataset.mode);return;}
  if(el.dataset.goto){aGo(+el.dataset.goto);return;}
  if(el.dataset.ans){aAns(el.dataset.ans);return;}
  if(el.dataset.w){S.anki.width=el.dataset.w;render();return;}
  if(el.dataset.ct){S.anki.ctheme=el.dataset.ct;render();return;}
  if(el.dataset.conf){S.anki.conflict=el.dataset.conf;render();toast(el.dataset.conf==='mine'?t('已保留你的版本；Anki 未运行，已排队，连上后写回','Kept yours — queued; written back once Anki is reachable'):t('已保留 Anki 中的版本','Kept the Anki version'));return;}
  if(el.dataset.annot){S.annot=+el.dataset.annot;render();return;}
  if(el.dataset.unmark){S.marks.splice(+el.dataset.unmark,1);render();return;}
  if(el.dataset.jump){e.preventDefault();document.getElementById(el.dataset.jump).scrollIntoView({behavior:S.shot?'auto':'smooth',block:'start'});return;}
  if(el.hasAttribute('data-close')&&!el.dataset.act){closeLayers(el.tagName!=='A');return;}
  const a=el.dataset.act;
  ({
    toc:openToc, lang:()=>setLang(), theme:()=>setTheme(), keys:keysDialog,
    submit, skip:()=>{S.skipAsk=true;render();}, 'skip-no':()=>{S.skipAsk=false;render();},
    'skip-yes':()=>{resetAttempt();toast(t('第 1 题已跳过，记为“跳过”','Item 1 skipped and recorded as skipped'));go('today');},
    hint:hintDialog, 'hint-yes':()=>{S.assisted=true;S.hintOpen=true;closeLayers();render();},
    mark:()=>{markSelection();$('#markpop')&&$('#markpop').classList.remove('on');},
    policy:()=>{S.policy=!S.policy;render();},
    'brief-resume':()=>{S.brief='running';render();}, 'brief-cancel':()=>{S.brief='cancelled';render();},
    'set-exam':()=>setDialog('exam'), 'set-daily':()=>setDialog('daily'),
    'save-exam':()=>{const v=$('#dlg-in').value;if(!v)return;S.examDate=v;closeLayers();render();},
    'save-daily':()=>{const v=+$('#dlg-in').value;if(!v)return;S.dailyMin=v;closeLayers();render();},
    aprev:()=>aGo(S.assess.cur-1), anext:()=>aGo(S.assess.cur+1), leave:()=>leaveDialog('today'),
    accept:()=>{S.anki.state='accepted';render();toast(t('已接受修订 1；Anki 未运行，已排队','Accepted revision 1; Anki not running, queued'));},
    askip:()=>{S.anki.state='skipped';render();}, aundo:()=>{S.anki.state='draft';render();},
    refine:stub('润色需要一次外部调用（DeepSeek，预算 +1）——原型中不发送','Refining needs one external call (DeepSeek, budget +1) — not sent in the prototype'),
    test:stub('测试需要一次外部调用（Qwen，预算 +1）——原型中不发送','A test needs one external call (Qwen, budget +1) — not sent in the prototype'),
    addkey:stub('会打开系统密钥库的输入框；密钥只写入那里，这里从不显示——原型中不执行','Opens the OS secret-store prompt; the key is written there and never shown here — not run in the prototype'),
    checkkey:stub('会从系统密钥库读取密钥并重新验证 text.chat（一次外部调用）——原型中不执行','Reads the key from the OS secret store and re-verifies text.chat (one external call) — not run in the prototype'),
    configure:stub('会要求端点地址、模型名与密钥；密钥写入系统密钥库——原型中不执行','Asks for an endpoint, model and key; the key goes to the OS secret store — not run in the prototype'),
    'revoke-ask':()=>{S.revokeAsk=true;render();}, 'revoke-no':()=>{S.revokeAsk=false;render();},
    consent:()=>{const now=new Date();const w=`11-13 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      S.consent=!S.consent;S.revokeAsk=false;S.events.forEach(x=>x.fresh=false);S.events.push({when:S.shot?'11-13 09:30':w,kind:S.consent?'grant':'revoke',fresh:true});render();},
    next:()=>{resetAttempt();}
  }[a]||(()=>{}))();
  if(a==='next')return; // allow link navigation
  if(el.tagName==='A'&&el.hasAttribute('data-close'))closeLayers(false);
});
document.addEventListener('input',e=>{
  if(e.target.id==='dlg-in'){const b=$('#dlg-save');if(b)b.disabled=!e.target.value;return;}
  const id=e.target.id, A=S.anki;
  if(id==='f-front')A.front=e.target.value; else if(id==='f-b1')A.back1=e.target.value; else if(id==='f-b2')A.back2=e.target.value; else if(id==='f-tac')A.tactic=e.target.value; else return;
  $('#stage').innerHTML=cardHTML();
  const fr=document.querySelector('.notes-list .fr'); if(fr)fr.textContent=A.front;
});
document.addEventListener('mouseover',e=>{const n=e.target.closest('[data-opt],[data-fn]');if(!n)return;if(n.dataset.opt&&route()==='feedback')hot(n.dataset.opt,true);if(n.dataset.fn)document.querySelectorAll(`[data-fn="${n.dataset.fn}"]`).forEach(x=>x.classList.add('hot'));});
document.addEventListener('mouseout',e=>{const n=e.target.closest('[data-opt],[data-fn]');if(!n)return;if(n.dataset.opt&&route()==='feedback')hot(n.dataset.opt,false);if(n.dataset.fn)document.querySelectorAll(`[data-fn="${n.dataset.fn}"]`).forEach(x=>x.classList.remove('hot'));});
document.addEventListener('mouseup',e=>{
  const pop=$('#markpop'); if(!pop)return;
  setTimeout(()=>{const sel=getSelection(),p=$('#passage');
    if(sel&&!sel.isCollapsed&&p&&p.contains(sel.anchorNode)&&sel.toString().trim()){
      const rr=sel.getRangeAt(0).getBoundingClientRect(),cr=$('#textcol').getBoundingClientRect();
      pop.style.left=(rr.left+rr.width/2-cr.left)+'px';pop.style.top=(rr.top-cr.top-8)+'px';pop.classList.add('on');
    } else if(!e.target.closest?.('#markpop')) pop.classList.remove('on');},0);
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const r=route(), k=e.key, typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  /* focus stays inside an open layer */
  if(k==='Tab'&&openEl){
    const f=[...openEl.querySelectorAll('a[href],button:not([disabled]),input,[tabindex="0"]')];
    if(f.length){const i=f.indexOf(document.activeElement);
      if(e.shiftKey&&(i<=0)){f[f.length-1].focus();e.preventDefault();}
      else if(!e.shiftKey&&(i===f.length-1||i<0)){f[0].focus();e.preventDefault();}}
    return;
  }
  if(k==='Escape'){if(layerOpen()){closeLayers();e.preventDefault();return;} if(typing){document.activeElement.blur();return;} if(r==='assess'){leaveDialog('today');return;} if(S.skipAsk){S.skipAsk=false;render();} return;}
  if(r==='anki'&&k==='Enter'&&(e.ctrlKey||e.metaKey)){if(S.anki.state==='draft'){S.anki.state='accepted';render();toast(t('已接受修订 1；Anki 未运行，已排队','Accepted revision 1; Anki not running, queued'));}e.preventDefault();return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(layerOpen()){
    if(openEl===$('#drawer')&&/^[1-7]$/.test(k)){closeLayers(false);go(ROUTES[+k-1]);}
    return;
  }
  const lk=k.length===1?k.toLowerCase():k;
  const onCtl=!!e.target.closest?.('button,a');
  if(k==='?'){keysDialog();return;}
  if(lk==='t'){setTheme();return;}
  if(lk==='l'){setLang();return;}
  if(r==='assess'){
    /* nothing leaves a timed run without the clock warning */
    if(k==='['||k===']'){leaveDialog(k===']'?'report':'feedback');return;}
    if(lk==='g'){leaveDialog('today');e.preventDefault();return;}
    const m={a:'A',b:'B',c:'C',d:'D','1':'A','2':'B','3':'C','4':'D'};
    if(m[lk]){aAns(m[lk]);return;}
    if(k===' '&&e.target.closest?.('[role=radio]')){aAns(e.target.dataset.ans);e.preventDefault();return;}
    if((k==='ArrowDown'||k==='ArrowUp')&&e.target.closest?.('[role=radio]')){const i=L4.indexOf(e.target.dataset.ans)+(k==='ArrowDown'?1:-1);const nx=document.querySelector(`[data-ans="${L4[Math.max(0,Math.min(3,i))]}"]`);if(nx){[...document.querySelectorAll('.omr [role=radio]')].forEach(x=>x.tabIndex=-1);nx.tabIndex=0;nx.focus();}e.preventDefault();return;}
    if(k==='ArrowRight'){aGo(S.assess.cur+1);e.preventDefault();return;}
    if(k==='ArrowLeft'){aGo(S.assess.cur-1);e.preventDefault();return;}
    return;
  }
  if(lk==='g'){openToc();e.preventDefault();return;}
  if(k==='['||k===']'){const i=ROUTES.indexOf(r)+(k===']'?1:-1);if(ROUTES[i])go(ROUTES[i]);return;}
  if(r==='today'&&k==='Enter'&&!onCtl){go('practice');return;}
  if(r==='practice'){
    const m={a:'A',b:'B',c:'C',d:'D','1':'A','2':'B','3':'C','4':'D'};
    if(m[lk]){choose(m[lk]);return;}
    if(k===' '&&e.target.closest?.('[data-choose]')){choose(e.target.dataset.choose);e.preventDefault();return;}
    if(k==='ArrowDown'||k==='ArrowUp'){const i=S.choice?L4.indexOf(S.choice):-1;const n=k==='ArrowDown'?Math.min(3,i+1):Math.max(0,i-1);choose(L4[n]);e.preventDefault();return;}
    if(k==='Enter'&&!e.target.closest?.('button,a')){submit();e.preventDefault();return;}
    if(lk==='h'&&!S.hintOpen){hintDialog();return;}
    if(lk==='s'){S.skipAsk=true;render();return;}
    if(lk==='m'){markSelection();return;}
  }
  if(r==='feedback'){
    const m={'1':'explain','2':'probe','3':'lesson'};
    if(m[k]){setMode(m[k]);return;}
    if(lk==='k'){go('anki');return;} if(lk==='n'){resetAttempt();go('practice');return;}
  }
  if(r==='anki'){
    if(lk==='p'){S.anki.width=S.anki.width==='phone'?'desktop':'phone';render();return;}
    if(lk==='s'&&S.anki.state==='draft'){S.anki.state='skipped';render();return;}
  }
});

/* ---------- clocks (frozen for screenshots) ---------- */
if(!S.shot){
  setInterval(()=>{
    const r=route();
    if(r==='practice'){S.pClock++;const c=$('#pclock');if(c)c.textContent=fmt(S.pClock);}
    const A=S.assess; A.left=Math.max(0,A.left-1);
    if(r==='assess'){if(A.item<90)A.item++;const a=$('#iclock'),b=$('#rclock'),c=$('#ibar');if(a)a.textContent=fmt(A.item);if(b)b.textContent=fmt(A.left);if(c)c.style.width=Math.min(100,A.item/90*100)+'%';}
  },1000);
}

render();
</script>
