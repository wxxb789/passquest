<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Quest — Folio</title>
<style>
/* =====================================================================
   FOLIO — design tokens
   One leaf on a desk: an inner margin (paragraph numbers, proof marks),
   one text block at a reading measure, a gutter, and an outer margin
   where notes live. Nothing else.
   ===================================================================== */
:root{
  /* colour — light: warm paper on a slightly darker desk, true ink,
     one proofreader vermilion, a muted indigo for advisory AI */
  --desk:#ECE8E0; --paper:#FBF9F5; --paper-sunk:#F4F1EA; --paper-raised:#FFFEFB;
  --ink:#1C1A17; --ink-2:#47423B; --ink-3:#655E54; --ink-4:#A39B8E;
  --rule:#E3DDD2; --rule-2:#CBC3B5; --edge:rgba(60,40,20,.11);
  --verm:#B3341D; --verm-wash:rgba(179,52,29,.10);
  --indigo:#34407A; --indigo-rule:rgba(52,64,122,.55);
  --ev-dot:#8A7A66; --moss:#47652F; --pen:rgba(28,26,23,.065);
  --leaf-shadow:-22px 0 40px -38px rgba(60,40,20,.45), 22px 0 40px -38px rgba(60,40,20,.45);
  --shadow-sheet:0 1px 0 rgba(60,44,24,.05), 0 22px 44px -26px rgba(60,44,24,.32);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .14  0 0 0 .11 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  /* type */
  --serif:"Sitka Text","Iowan Old Style","Charter","Georgia","Noto Serif SC","Songti SC","Source Han Serif SC","SimSun",serif;
  --serif-sm:"Sitka Small","Sitka Text","Iowan Old Style","Georgia","Noto Serif SC","Songti SC","SimSun",serif;
  --serif-hd:"Sitka Heading","Sitka Text","Iowan Old Style","Georgia","Noto Serif SC","Songti SC","SimSun",serif;
  --serif-dp:"Sitka Display","Sitka Heading","Iowan Old Style","Georgia","Noto Serif SC","Songti SC",serif;
  --kai:"Sitka Text","Iowan Old Style","Georgia","KaiTi","STKaiti","Kaiti SC","Noto Serif SC",serif;
  --cjk:"Noto Serif SC","Songti SC","Source Han Serif SC","SimSun",serif;
  --mono:"Cascadia Mono","SF Mono","Menlo","Consolas","Noto Sans SC",monospace;
  /* space (4-based) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:2px;
  /* motion */
  --ease:cubic-bezier(.3,0,.12,1); --d1:160ms; --d2:320ms; --d3:640ms; --d-ink:900ms;
  /* the leaf */
  --head-h:52px; --foot-h:42px;
  --in:clamp(60px,5vw,76px);          /* inner margin: paragraph numbers, proof marks */
  --tb:clamp(556px,41vw,590px);       /* text block, ~35em of the reading serif */
  --gt:clamp(36px,3vw,44px);          /* gutter — no rule */
  --mg:clamp(262px,22vw,316px);     /* outer margin: notes */
  --out:clamp(30px,2.8vw,40px);       /* fore-edge */
  --leaf:calc(var(--in) + var(--tb) + var(--gt) + var(--mg) + var(--out));
  color-scheme:light;
}
[data-theme="dark"]{
  --desk:#17120E; --paper:#231C16; --paper-sunk:#1D1712; --paper-raised:#2A221B;
  --ink:#E6DCCB; --ink-2:#CDC1AE; --ink-3:#A89A86; --ink-4:#6E6252;
  --rule:rgba(230,220,203,.13); --rule-2:rgba(230,220,203,.26); --edge:rgba(0,0,0,.5);
  --verm:#E07A5F; --verm-wash:rgba(224,122,95,.15);
  --indigo:#A9B3E6; --indigo-rule:rgba(169,179,230,.55);
  --ev-dot:#93856F; --moss:#A8C088; --pen:rgba(230,220,203,.075);
  --leaf-shadow:-26px 0 44px -36px rgba(0,0,0,.9), 26px 0 44px -36px rgba(0,0,0,.9);
  --shadow-sheet:0 1px 0 rgba(0,0,0,.25), 0 24px 48px -24px rgba(0,0,0,.7);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95  0 0 0 0 .88  0 0 0 0 .76  0 0 0 .055 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  color-scheme:dark;
}
[data-route="assess"] .rh{border-bottom:0}
/* the exam paper: cooler, plainer stock; no grain; no outer margin */
[data-route="assess"]{--paper:#FCFCFA;--paper-sunk:#F3F3F0;--desk:#E4E3DF;--grain:none;--leaf:760px;--in:60px;--out:60px}
[data-route="assess"][data-theme="dark"]{--paper:#1E1C1A;--paper-sunk:#191715;--desk:#121110}

/* =====================================================================
   base
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--desk); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.55;
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-kerning:normal; text-autospace:normal; text-spacing-trim:normal;
  overflow:hidden;
}
html[lang="zh-Hans"] body{line-height:1.75}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button[disabled]{cursor:not-allowed}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:var(--r1)}
::selection{background:color-mix(in srgb,var(--verm) 18%,transparent)}
p{text-wrap:pretty}
.tn{font-variant-numeric:lining-nums tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:0}
.nw{white-space:nowrap}
/* eyebrow labels: small caps in English, set solid (no tracking) in Chinese */
.micro{
  font-family:var(--serif-sm);font-size:11.5px;line-height:1.35;color:var(--ink-3);
  font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:500;font-size:12.5px;
}
:lang(zh) .micro,.micro:lang(zh){font-family:var(--cjk);font-variant-caps:normal;letter-spacing:0;font-size:12px;font-weight:600}
.micro[lang="en"]{font-family:var(--serif-sm);font-variant-caps:all-small-caps;letter-spacing:.08em;font-size:12.5px;font-weight:500}
.muted{color:var(--ink-3)}
.verm{color:var(--verm)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{
  font-family:var(--mono);font-size:10.5px;line-height:1;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;
  border:1px solid var(--rule-2);border-radius:2px;background:transparent;
  vertical-align:1px;letter-spacing:0;font-weight:400;
}
.glyph{display:inline-block;vertical-align:-1px;flex:none}
.tag{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:0;white-space:nowrap}
.arrow{font-family:var(--serif);font-feature-settings:normal}

/* =====================================================================
   frame: running head (书眉) and running foot are printed on the leaf
   ===================================================================== */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:var(--head-h) 1fr var(--foot-h)}
.frame{width:var(--leaf);margin:0 auto;height:100%;padding:0 var(--out) 0 var(--in);background:var(--grain),var(--paper)}
body::before{content:"";position:fixed;top:0;bottom:0;left:50%;width:var(--leaf);transform:translateX(-50%);box-shadow:-1px 0 0 var(--edge),1px 0 0 var(--edge),var(--leaf-shadow);pointer-events:none;z-index:0}
.runhead,.runfoot{position:relative;z-index:5}
.rh{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:20px;border-bottom:1px solid var(--rule)}
.rh-left{display:flex;align-items:baseline;gap:12px;min-width:0;white-space:nowrap}
.brand{font-family:var(--serif-hd);font-size:15px;letter-spacing:.12em;font-variant-caps:all-small-caps;font-weight:600;color:var(--ink)}
.rh-sep{width:1px;height:12px;background:var(--rule-2);align-self:center}
.rh-sec{font-size:14px;color:var(--ink-2)}
.rh-mid{font-size:13px;color:var(--ink-2);white-space:nowrap;display:flex;gap:9px;align-items:baseline}
.rh-mid b{font-weight:600;color:var(--ink)}
.rh-mid .dot{color:var(--ink-3)}
.rh-right{display:flex;align-items:center;justify-content:flex-end;gap:2px;white-space:nowrap}
.rh-btn{
  height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:var(--r1);
  font-size:13px;color:var(--ink-2);transition:background var(--d1),color var(--d1);
}
.rh-btn:hover{background:var(--pen);color:var(--ink)}
.rh-btn svg{width:14px;height:14px}
.lang-sw span{font-size:13px;color:var(--ink-3);padding:0 2px}
.lang-sw span.cur{color:var(--ink);font-weight:600}
.lang-sw [lang="zh-Hans"]{font-family:var(--cjk);font-size:14px;font-weight:600}
.lang-sw span.cur[lang="zh-Hans"]{font-weight:700}
.lang-sw i{width:1px;height:11px;background:var(--rule-2);display:inline-block;margin:0 3px}
.rf{height:100%;display:grid;grid-template-columns:minmax(max-content,1fr) auto 1fr;align-items:center;column-gap:20px;border-top:1px solid var(--rule)}
.rf-keys{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;min-width:0}
.rf-keys > span{display:inline-flex;gap:5px;align-items:center}
.folio{font-family:var(--serif-sm);font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.folio .rn{letter-spacing:.18em;font-variant-caps:all-small-caps;font-size:14px}
.folio .pp{font-family:var(--serif);font-size:12.5px}
.rf-nav{display:flex;justify-content:flex-end;gap:18px;font-size:12.5px;white-space:nowrap}
.rf-nav a{text-decoration:none;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center}
.rf-nav a:hover{color:var(--ink)}

main#main{overflow-y:auto;overflow-x:hidden;position:relative;scroll-padding-bottom:24px}

/* =====================================================================
   the leaf: text block + outer margin. No sidebar, no full-height rules.
   ===================================================================== */
.leaf{
  width:var(--leaf);margin:0 auto;min-height:100%;position:relative;
  padding:26px var(--out) 64px var(--in);
  background:var(--grain),var(--paper);
  display:grid;grid-template-columns:var(--tb) var(--mg);column-gap:var(--gt);align-content:start;
}
.tb{grid-column:1;position:relative;min-width:0;isolation:isolate}
.mg{grid-column:2;position:relative;min-width:0}
.wide{grid-column:1 / -1;min-width:0}
svg.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
svg.leaders path{fill:none;stroke:var(--rule-2);stroke-width:.75}
svg.leaders path.k{stroke:var(--verm)}
svg.leaders circle{fill:var(--rule-2)} svg.leaders circle.k{fill:var(--verm)}
svg.leaders .hot{stroke:var(--ink)} svg.leaders circle.hot{fill:var(--ink)}

/* margin notes (旁注) */
.mnote{font-family:var(--serif-sm);font-size:13px;line-height:1.5;color:var(--ink-2);position:absolute;left:0;right:0;transition:color var(--d1)}
html[lang="zh-Hans"] .mnote{line-height:1.72;font-size:13px}
.mnote .mh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.mnote p{margin:0}
.mnote p + p{margin-top:4px}
.mnote b{font-weight:600;color:var(--ink)}
.mnote .acts{display:flex;gap:14px;margin-top:3px}
.mnote.num{display:grid;grid-template-columns:18px 1fr}
.mnote .nn{font-family:var(--serif-sm);font-size:12px;color:var(--verm);font-weight:600;line-height:1.6}
.mnote.hot,.mnote:hover{color:var(--ink)}
/* note reference numerals in running text */
sup.fn{text-autospace:no-autospace;font-family:var(--serif-sm);font-size:.64em;line-height:0;vertical-align:.62em;padding-left:.06em;color:var(--verm);font-weight:600;font-variant-numeric:lining-nums;cursor:default}
sup.fn.hot{text-decoration:underline;text-underline-offset:2px}

/* typographic controls — outlined; ink fills are reserved for marks ≤ 24px */
.btn{
  text-decoration:none;display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 16px;border-radius:var(--r1);
  font-size:14.5px;font-weight:500;border:1px solid var(--rule-2);color:var(--ink);background:transparent;
  transition:background var(--d1) var(--ease),border-color var(--d1),color var(--d1),transform var(--d1);
  white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3);background:var(--pen)}
.btn:active{transform:translateY(1px)}
.btn.pri{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.btn.pri:hover{background:var(--pen)}
.btn[disabled]{transform:none;background:transparent;color:var(--ink-3);border-color:var(--rule-2);box-shadow:none}
.btn.sm{height:30px;padding:0 11px;font-size:13.5px;gap:7px}
.link{
  font-size:inherit;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-2);
  text-decoration-thickness:1px;text-underline-offset:3px;transition:text-decoration-color var(--d1);cursor:pointer;
}
.link:hover{text-decoration-color:var(--ink)}
.link.v{color:var(--verm);text-decoration-color:color-mix(in srgb,var(--verm) 45%,transparent)}
.link.i{color:var(--indigo);text-decoration-color:var(--indigo-rule)}
/* imperative with a vermilion underline — the one primary act on a page */
.imp{display:inline-flex;align-items:baseline;gap:10px;text-decoration:none;font-family:var(--serif-hd);font-size:19px;color:var(--ink);padding:2px 0 5px;
  background:linear-gradient(var(--verm),var(--verm)) 0 100%/100% 1.5px no-repeat;transition:background-size var(--d2) var(--ease)}
.imp:hover{background-size:100% 3px}
.imp kbd{transform:translateY(-2px)}
/* text toggles: options separated by a middle dot, active one underlined */
.tog{display:inline-flex;gap:0;align-items:baseline;font-size:13px;color:var(--ink-3)}
.tog button{padding:2px 1px;color:var(--ink-3)}
.tog button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.tog button:hover{color:var(--ink)}
.tog .d{margin:0 7px;color:var(--ink-4)}

/* =====================================================================
   condition glyphs
   ===================================================================== */
.cond{display:inline-flex;align-items:baseline;gap:7px}
.cg{width:9px;height:9px;flex:none;display:inline-block;align-self:center}
.cg.ind{border-radius:50%;background:var(--ink)}
.cg.asst{border-radius:50%;border:1.5px solid var(--ink-3);background:linear-gradient(135deg,transparent 42%,var(--ink-3) 42%,var(--ink-3) 60%,transparent 60%)}
.cg.reex{border-radius:50%;border:1.5px solid var(--ink-3)}
.cg.assess{border:1.5px solid var(--ink)}

/* =====================================================================
   passage — the reading column
   ===================================================================== */
.p-kicker{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.p-title{font-family:var(--serif-hd);font-size:27px;line-height:1.2;font-weight:400;letter-spacing:-.005em;margin:0 0 14px;color:var(--ink);text-wrap:balance}
.passage{font-family:var(--serif);font-size:17.5px;line-height:1.6;color:var(--ink);font-variant-numeric:oldstyle-nums proportional-nums;hyphens:manual}
.passage p{margin:0;position:relative}
.passage p + p{text-indent:1.6em}
.passage .pn{position:absolute;left:-36px;top:.38em;width:20px;text-align:right;font-family:var(--serif-sm);font-size:12px;line-height:1;color:var(--ink-3);text-indent:0;font-variant-numeric:lining-nums tabular-nums}
.passage mark.pen{background:linear-gradient(transparent 60%,var(--pen) 60%);color:inherit;border-bottom:1px solid var(--ink-3);padding:0 1px}
/* evidence: supporting spans dotted umber; the key's evidence inked in vermilion */
.passage .ev{text-decoration:underline dotted 1px var(--ev-dot);text-underline-offset:4px;transition:background-color var(--d2)}
.passage .ev.hot{background-color:var(--pen)}
.passage .ev-key{text-decoration:none;padding-bottom:1px;
  background:linear-gradient(var(--verm),var(--verm)) 0 100%/100% 2px no-repeat,linear-gradient(var(--verm-wash),var(--verm-wash));
  animation:inkdraw var(--d-ink) var(--ease) 350ms both}
.passage .ev-key.hot{background-color:transparent}
.passage .ev-key b{font-weight:600}
sup.evm{font-family:var(--serif-sm);font-size:.6em;line-height:0;vertical-align:.66em;padding-left:.08em;font-weight:600;color:var(--ink-3);font-variant-numeric:lining-nums}
.ev-key sup.evm{color:var(--verm)}
@keyframes inkdraw{from{background-size:0 2px,100% 100%}to{background-size:100% 2px,100% 100%}}
.p-foot{margin-top:18px;display:flex;gap:8px;font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* selection → mark popover */
.markpop{position:absolute;z-index:20;transform:translate(-50%,-100%);display:none}
.markpop.on{display:block}
.markpop button{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--paper-raised);color:var(--ink);border:1px solid var(--ink);border-radius:var(--r1);font-size:13px;box-shadow:var(--shadow-sheet)}

/* =====================================================================
   question block — set in the text block, under the passage
   ===================================================================== */
.qblock{margin-top:22px;border-top:1px solid var(--ink);padding-top:12px;position:relative}
.qhead{display:flex;align-items:baseline;gap:12px;min-height:30px;position:relative}
.qn{font-family:var(--serif-dp);font-size:25px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.qn.hang{position:absolute;right:calc(100% + 12px);top:13px;font-size:24px}
.qblock > .qn.hang + .stem{margin-top:0}
.qhead .sp{flex:1}
.qhead .cond{font-size:14px;color:var(--ink-2)}
.qhead .cond b{color:var(--ink);font-weight:600}
.stem{font-family:var(--serif);font-size:17.5px;line-height:1.5;margin:10px 0 8px;color:var(--ink);text-wrap:pretty}
.opts{list-style:none;margin:0;padding:0}
.opt{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:6px;
  padding:4px 8px 4px 0;margin:0;cursor:pointer;position:relative;
  font-size:16.5px;line-height:1.45;
}
.opt::before{content:"";position:absolute;left:-42px;right:0;top:0;bottom:0;border-radius:var(--r1);background:transparent;transition:background var(--d1);z-index:-1}
.opt:hover::before{background:var(--pen)}
/* option letter: hangs in the inner margin; plain bold serif before grading,
   a pencil-filled disc once chosen (one aspect-ratio:1 rule, never squashed) */
.L{position:absolute;left:-36px;top:4px;display:grid;place-items:center;width:24px;aspect-ratio:1;font-family:var(--serif-sm);font-size:14px;font-weight:700;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums}
.L::after{content:".";position:absolute;left:17px;bottom:5px;font-weight:700}
.opt .k{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);opacity:0;transition:opacity var(--d1)}
.opt:hover .k,.opt:focus-visible .k{opacity:1}
.opt.sel .L,.omr li.sel .L{background:var(--ink);color:var(--paper);border-radius:50%;width:22px;left:-35px;top:6px;font-size:12.5px}
.opt.sel .L::after,.omr li.sel .L::after{content:none}
.opt.sel::before{background:var(--pen)}
.opt.sel .k{opacity:1}
.slip-actions{display:flex;align-items:center;gap:10px;margin-top:14px}
.slip-actions .sp{flex:1}
.hintbtn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);height:36px;padding:0 8px;border-radius:var(--r1)}
.hintbtn:hover{background:var(--pen);color:var(--ink)}
.hintbtn svg{width:13px;height:13px}
/* gate text lives in the condition note */
.condn{margin:2px 0 0;display:grid;grid-template-columns:16px 1fr;align-items:baseline;font-size:14px;line-height:1.5;color:var(--ink-2)}
.condn .cg{align-self:start;margin-top:6px}
.condn b{color:var(--ink);font-weight:600}
.clockv{font-family:var(--serif-hd);font-size:20px;color:var(--ink);margin-right:6px}
.hintbox{margin-top:12px;padding:6px 0 6px 14px;border-left:2px solid var(--ink-3);font-size:14.5px;color:var(--ink-2)}
.confirm-inline{margin-top:10px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* =====================================================================
   feedback — proof correction
   ===================================================================== */
.vword{font-family:var(--serif-hd);font-size:20px;font-weight:600}
.vword.wrong{color:var(--verm)}
.vk{font-size:15px;color:var(--ink-2)}
.vk b{font-weight:700;color:var(--ink)}
.vt{font-size:14px;color:var(--ink-2)}
.vt b{font-family:var(--serif-hd);font-size:17px;font-weight:400;color:var(--ink)}
.vc{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.vc .muted{white-space:nowrap}
.opt.fb{cursor:default;padding:5px 8px 5px 0}
.opt.fb:hover::before{background:transparent}
.opt.fb .L{color:var(--ink-3)}
.opt.fb .tx{color:var(--ink-2)}
.opt.fb .an{font-size:12px;color:var(--ink-3);white-space:nowrap;font-family:var(--serif-sm);margin-left:6px}
html[lang="en"] .opt.fb .an{font-variant-caps:all-small-caps;font-size:13px;letter-spacing:.07em}
html[lang="zh-Hans"] .opt.fb .an{font-family:var(--cjk);font-weight:600}
.opt.fb.hot::before{background:var(--pen)}
.opt.struck .tx s{text-decoration:none;color:var(--ink-3);background-image:linear-gradient(var(--verm),var(--verm));background-repeat:no-repeat;background-position:0 58%;background-size:100% 1.25px;animation:strike 700ms var(--ease) 500ms both;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@keyframes strike{from{background-size:0 1.25px}to{background-size:100% 1.25px}}
.opt.struck .an{color:var(--verm)}
.opt.keyopt .L{color:var(--verm)}
.opt.keyopt .L::after{content:none}
.opt.keyopt .tx > span[lang]{color:var(--ink);font-weight:600}
.opt.keyopt .an{color:var(--verm)}
.ringmark{position:absolute;left:50%;top:50%;width:30px;height:26px;transform:translate(-50%,-50%) rotate(-4deg);overflow:visible;pointer-events:none}
.ringmark ellipse{fill:none;stroke:var(--verm);stroke-width:1.25;stroke-linecap:round;stroke-dasharray:100 6;stroke-dashoffset:0;animation:ring 900ms var(--ease) 800ms both}
@keyframes ring{from{stroke-dashoffset:106}to{stroke-dashoffset:0}}
.dele{position:absolute;left:-56px;top:5px;width:16px;height:20px;overflow:visible}
.dele path{fill:none;stroke:var(--verm);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.tactic{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:baseline}
.tactic .micro{white-space:nowrap}
.tactic p{margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
html[lang="zh-Hans"] .tactic p{line-height:1.75}
.nextsteps{margin-top:16px;display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.nextsteps .imp{font-size:17px}
.sect-rule{margin:30px 0 14px;display:flex;align-items:baseline;gap:12px}
.sect-rule::after{content:"";flex:1;height:1px;background:var(--rule);transform:translateY(-4px)}

/* coach — advisory side-note, indigo, its own voice */
.coach{padding:0 0 0 14px;border-left:2px solid var(--indigo-rule)}
.coach .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.coach .mh .micro{color:var(--indigo)}
.ext{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--indigo);white-space:nowrap}
.ext svg{width:11px;height:11px}
.disc{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--ink-2)}
html[lang="zh-Hans"] .disc{line-height:1.65}
.disc .k{color:var(--ink-3)}
.disc .w{color:var(--verm)}
.modes{display:flex;gap:2px;margin:8px 0 6px -6px}
.modes button{font-size:13px;color:var(--ink-3);padding:2px 6px 5px;border-radius:var(--r1);position:relative}
.modes button .mk{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:4px}
.modes button[aria-selected="true"]{color:var(--indigo)}
.modes button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:1px;height:1.5px;background:var(--indigo)}
.modes button:hover{color:var(--indigo)}
.coach-reply{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.55;color:var(--indigo);margin:0;animation:fadein 600ms var(--ease) both}
html[lang="zh-Hans"] .coach-reply{font-family:var(--kai);font-style:normal;font-size:15px;line-height:1.75;letter-spacing:0}
html[lang="zh-Hans"] .coach-reply i{font-style:italic;font-family:var(--serif)}
.coach-reply.pending{color:var(--ink-3);font-style:normal;font-family:var(--serif-sm);font-size:13px}
.coach-reply.withheld{color:var(--ink-2);font-style:normal;font-family:var(--serif-sm);font-size:13px}
.coach-foot{margin:6px 0 0;font-size:12px;color:var(--ink-3)}

/* =====================================================================
   today — the letter
   ===================================================================== */
.dateline{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.dateline .d{font-size:13.5px;color:var(--ink-2)}
.chapter{font-family:var(--serif-hd);font-size:15px;color:var(--ink);font-weight:600;letter-spacing:.01em}
html[lang="zh-Hans"] .chapter{font-family:var(--cjk);letter-spacing:0}
.salute{margin:30px 0 4px;font-size:17px;color:var(--ink-2)}
.headline{font-family:var(--serif-hd);font-size:34px;line-height:1.18;font-weight:400;margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
html[lang="zh-Hans"] .headline{font-weight:500;letter-spacing:0;line-height:1.32;font-size:33px}
.headline .skillname{white-space:nowrap}
.letter p{font-size:17px;line-height:1.72;margin:0 0 12px;color:var(--ink);max-width:35em}
html[lang="zh-Hans"] .letter p{font-size:16.5px;line-height:1.95;text-wrap:wrap}
.letter p b{font-weight:600}
.actionrow{display:flex;gap:22px;align-items:baseline;margin:20px 0 0}
.policy{margin-top:12px;font-size:13.5px;color:var(--ink-2);border-left:1px solid var(--rule-2);padding:2px 0 2px 14px;display:none}
.policy.on{display:block;animation:fadein 400ms var(--ease) both}
.policy p{margin:0 0 3px;font-size:13.5px;line-height:1.6}
.signoff{margin:18px 0 0;font-size:13.5px;color:var(--ink-3);font-style:italic;text-align:right}
html[lang="zh-Hans"] .signoff{font-style:normal}
.ledger{margin-top:30px}
.ledger-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px}
.ledger-h h2,.ledger-h h3{margin:0;font-family:var(--serif-hd);font-size:17px;font-weight:600;letter-spacing:.005em}
html[lang="zh-Hans"] .ledger-h h2,html[lang="zh-Hans"] .ledger-h h3{font-family:var(--cjk);letter-spacing:0}
table.tab{width:100%;border-collapse:collapse;font-variant-numeric:lining-nums tabular-nums}
table.tab th{font-weight:400;text-align:left;padding:7px 20px 5px 0;vertical-align:bottom;border-bottom:1px solid var(--rule);white-space:nowrap}
table.tab td{padding:9px 20px 9px 0;border-bottom:1px solid var(--rule);vertical-align:baseline;font-size:14.5px}
table.tab.led td,table.tab.led th{padding-right:14px}
table.tab.led td:last-child,table.tab.led th:last-child{padding-right:0}
table.tab.led .skill-n{white-space:nowrap}
.ticks{margin-right:8px}
table.tab td:last-child,table.tab th:last-child{padding-right:0}
table.tab td.r,table.tab th.r{text-align:right}
table.tab tr:last-child td{border-bottom:1px solid var(--rule-2)}
.skill-n{font-size:15px;color:var(--ink);display:block;line-height:1.3}
.skill-s{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline;margin-top:2px}
.ticks{display:inline-block;vertical-align:-1px;margin-right:10px}
.ticks circle{stroke:var(--ink);stroke-width:1;fill:none}
.ticks circle.c{fill:var(--ink)}
.frac{font-size:14.5px;white-space:nowrap}
.frac b{font-weight:600}
.frac .of{color:var(--ink-3)}
.nc{color:var(--ink-2)}
.act{font-family:var(--mono);font-size:12px;color:var(--ink)}
.act-l{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ledger-notes{margin-top:10px;font-size:12.5px;color:var(--ink-3);display:grid;gap:3px;line-height:1.6}
.ledger-notes p{margin:0;display:grid;grid-template-columns:18px 1fr}
.ledger-notes .ticks{margin:0}
.ps{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px;line-height:1.75;color:var(--ink-2)}
.ps p{margin:0}
.ps .lbl{font-family:var(--serif-hd);font-weight:600;color:var(--ink);margin-right:6px}
html[lang="zh-Hans"] .ps .lbl{font-family:var(--cjk)}
.ps b{font-weight:600;color:var(--ink)}

/* =====================================================================
   assessment — the exam paper
   ===================================================================== */
.leaf.exam{grid-template-columns:1fr;padding-top:22px;isolation:isolate}
.exhead{border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:8px 0 9px;display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:24px}
.ex-run{font-family:var(--serif-hd);font-size:21px;line-height:1.2;font-weight:600}
html[lang="zh-Hans"] .ex-run{font-family:var(--cjk);font-size:20px}
.ex-rules{font-size:13px;color:var(--ink-2);margin-top:4px}
.ex-clocks{display:flex;gap:30px;align-items:flex-end}
.ck{text-align:right}
.ck .lbl{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.ck .val{font-family:var(--serif-dp);font-size:32px;line-height:.95;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.ck .val .of{font-size:16px;color:var(--ink-3);font-family:var(--serif-hd);letter-spacing:0}
.ck.item .val{font-size:24px}
.ck .bar{display:block;height:1.5px;background:var(--rule-2);margin-top:6px;position:relative}
.ck .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.ex-strip{padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.ex-strip .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ex-strip .itemno{font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:baseline;gap:4px}
.stepb{width:26px;height:24px;border-radius:var(--r1);color:var(--ink-2);font-size:15px}
.stepb:first-child{margin-left:-7px}
.stepb:hover{background:var(--pen);color:var(--ink)}
.stepb[disabled]{color:var(--ink-4)}
.ex-strip .itemno b{font-family:var(--serif-hd);font-size:17px;font-weight:600;color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(20,1fr);row-gap:2px}
.cell{height:23px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-variant-numeric:lining-nums tabular-nums;position:relative;border-radius:1px}
.cell:hover{color:var(--ink);background:var(--pen)}
.cell.ans{color:var(--ink)}
.cell.ans::after{content:"";position:absolute;left:calc(50% - 4px);bottom:2px;width:8px;height:2px;background:var(--ink-2)}
.cell.to{color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--rule-2) 3px 4px)}
.cell.cur{color:var(--ink);font-weight:700}
.cell.cur::before{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:1.25px solid var(--ink);border-radius:50%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-3);align-items:center}
.legend > span{display:inline-flex;align-items:center;gap:3px}
.legend b{font-weight:600;color:var(--ink)}
.legend .cell{width:24px;height:22px;font-style:normal;font-size:11px}
.legend .cell.cur::before{width:19px;height:19px}
.exam .passage{font-size:16px;line-height:1.58}
.ex-k{margin:16px 0 8px;align-items:baseline}
.exam .ex-k .p-title{font-size:22px;margin:0}
.exnav{display:flex;gap:10px;align-items:center;margin-top:10px}
.exnav .nofb{flex:1;margin:0}
.omr{list-style:none;margin:0;padding:0}
.omr li{position:relative;padding:4px 8px 4px 0;cursor:pointer;font-size:16px;line-height:1.45}
.omr li::before{content:"";position:absolute;left:-42px;right:0;top:0;bottom:0;border-radius:var(--r1);transition:background var(--d1);z-index:-1}
.omr li:hover::before{background:var(--pen)}
.omr li .L{top:4px}
.omr li.locked{cursor:not-allowed;color:var(--ink-3)}
.nofb{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
/* exam nav: see .exnav above */

/* =====================================================================
   report
   ===================================================================== */
.score{display:flex;align-items:flex-end;gap:22px;margin:22px 0 4px}
.score .big{font-family:var(--serif-dp);font-size:76px;line-height:.82;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.score .big .of{color:var(--ink-3);font-size:.5em;letter-spacing:0}
.score .cap{padding-bottom:4px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.pass-unknown{font-size:16px;color:var(--ink);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0;margin:16px 0 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pass-unknown b{font-weight:600}
.strip{display:inline-flex;gap:3px;align-items:flex-end;height:15px;vertical-align:-2px}
.strip i{width:3px;height:15px;background:var(--ink);display:block}
.strip i.x{height:6px;background:var(--ink-3)}
.strip i.t{height:6px;background:var(--verm)}
.timeline{margin:18px 0 0;font-size:16px;line-height:1.7}
html[lang="zh-Hans"] .timeline{line-height:1.9}
.timeline b{font-weight:600}
.timeline .u{font-size:.8em;color:var(--ink-3);margin-left:1px}
.withheld{margin-top:26px}
.wnums{margin:8px 0 0;font-size:15px;line-height:2;letter-spacing:0}
.wnums button{padding:0 .26em;color:var(--ink-2);font-variant-numeric:lining-nums tabular-nums;text-underline-offset:5px}
.wnums button:hover{color:var(--ink)}
.wnums button[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--verm);text-decoration-thickness:1.5px}
.annot-detail{margin-top:6px;font-size:14px;line-height:1.65;color:var(--ink-2);padding-left:12px;border-left:1px solid var(--rule-2)}
.annot-detail b{font-weight:600;color:var(--ink)}
.fnotes{margin-top:28px;padding-top:10px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2);line-height:1.6;max-width:36em}
html[lang="zh-Hans"] .fnotes{line-height:1.75}
.fnotes p{margin:0 0 4px;display:grid;grid-template-columns:16px 1fr}
.fnotes .fnm{color:var(--verm);font-weight:600;font-family:var(--serif-sm)}
.cmp-axis{position:relative;height:50px;margin:10px 4px 2px}
.cmp-axis .ax{position:absolute;left:0;right:0;top:26px;height:1px;background:var(--rule-2)}
.cmp-axis .tk{position:absolute;top:23px;width:1px;height:7px;background:var(--rule-2)}
.cmp-axis .tl{position:absolute;top:33px;transform:translateX(-50%);font-size:11px;color:var(--ink-3)}
.cmp-axis .pt{position:absolute;top:21px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);border:1.25px solid var(--ink);background:var(--paper)}
.cmp-axis .pt.n{background:var(--ink)}
.cmp-axis .pl{position:absolute;top:0;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.cmp-axis .seg{position:absolute;top:26px;height:1.5px;background:var(--ink)}
.delta{font-family:var(--serif-hd);font-size:28px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.checks{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.checks li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;padding:3px 0;border-top:1px solid var(--rule);align-items:baseline}
.checks li:last-child{border-bottom:1px solid var(--rule)}
.checks .eq{color:var(--ink-3);font-size:12.5px}

/* =====================================================================
   anki — the printed index card, proof fields, sync ledger
   ===================================================================== */
.plate{display:flex;justify-content:center;gap:var(--gt);padding:18px 0 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px}
.plate-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.plate-h .ctl{display:flex;gap:22px}
.cardw{flex:0 1 440px;min-width:0;transition:flex-basis var(--d3) var(--ease)}
.cardw.phone{flex-basis:300px}
.cardw .wl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.cardw .wl .tn{font-family:var(--serif-sm)}
.plate-cap{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;text-align:center}
/* the card — self-contained colours so it renders the same in Anki */
.icard{--c-bg:#FBF8F0;--c-edge:#D9CFBF;--c-ink:#1E1B17;--c-mute:#6B6458;--c-red:#B3341D;--c-blue:rgba(70,100,160,.18);
  aspect-ratio:5/3;background:var(--c-bg);color:var(--c-ink);border:1px solid var(--c-edge);border-radius:1px;
  padding:0 26px 10px;font-family:var(--serif);position:relative;
  background-image:linear-gradient(var(--c-red),var(--c-red)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--c-blue) 21px 22px);
  background-size:100% 1px,100% calc(100% - 35px);background-position:0 34px,0 35px;background-repeat:no-repeat,no-repeat}
.icard.dk{--c-bg:#2A241E;--c-edge:#463C31;--c-ink:#EDE3D2;--c-mute:#A99D8A;--c-red:#E07A5F;--c-blue:rgba(150,170,225,.13)}
.icard .ch{height:34px;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:6px}
.icard .ch .t{font-family:var(--serif-sm);font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--c-red);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .ch .s{font-family:var(--mono);font-size:10px;color:var(--c-mute);white-space:nowrap}
.icard .front{font-family:var(--serif-hd);font-size:25px;line-height:44px;padding-top:34px;text-wrap:balance}
.icard.ph .front{font-size:20px}
.icard .front em{font-style:normal;font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--c-red);font-weight:600;font-size:1.08em}
.icard .cf{position:absolute;left:26px;right:26px;bottom:8px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--c-mute);font-family:var(--serif-sm);line-height:14px}
.icard .back{padding-top:4px}
.icard .back p{margin:0;font-size:14px;line-height:22px}
.icard .back .lab{display:block;font-family:var(--serif-sm);font-size:10.5px;font-variant-caps:all-small-caps;letter-spacing:.12em;color:var(--c-mute);line-height:22px}
.icard .back .lab:lang(zh){font-family:var(--cjk);font-variant-caps:normal;letter-spacing:0;font-weight:600}
.icard .back p.ex{font-style:italic}
.icard .back p.ex b{font-style:normal;font-weight:600;box-shadow:inset 0 -1.5px 0 var(--c-red)}
.icard.ph .back p{font-size:13px}
.field{display:grid;grid-template-columns:118px 1fr;column-gap:16px;align-items:baseline;padding:8px 0 9px;border-bottom:1px solid var(--rule)}
.field:first-of-type{border-top:1px solid var(--ink)}
.field .fl{padding-top:2px}
.field input,.field textarea{width:100%;border:0;background:transparent;padding:2px 0 3px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink);resize:none;border-radius:0;
  background-image:linear-gradient(to right,var(--ink-3) 0 1px,transparent 1px 4px);background-size:4px 1px;background-repeat:repeat-x;background-position:0 100%;cursor:text;transition:background var(--d1)}
.field input:hover,.field textarea:hover{background-image:linear-gradient(var(--ink-3),var(--ink-3));background-size:100% 1px}
.field input:focus,.field textarea:focus{background-image:linear-gradient(var(--ink),var(--ink));background-size:100% 1px;outline:none;caret-color:var(--verm)}
.field input[disabled],.field textarea[disabled]{background-image:none;color:var(--ink-2);cursor:default}
.field textarea{height:72px}
.field textarea.short{height:28px}
.field .ro{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.field .why{font-size:12px;color:var(--ink-3);margin-left:10px}
.anki-actions{display:flex;gap:22px;margin-top:16px;align-items:baseline}
.anki-actions .imp{font-size:17px}
.st{font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.st svg{width:11px;height:11px;flex:none}
.st.conflict{color:var(--verm)}
.notes-list{list-style:none;margin:6px 0 0;padding:0}
.notes-list li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:13px;align-items:baseline}
.notes-list .fr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif)}
.conflict-box{grid-column:1 / -1;margin:2px 0 4px;display:grid;grid-template-columns:1fr 1fr;column-gap:0}
.conflict-box .v{font-size:12.5px;line-height:1.5;padding:2px 10px 4px 0}
.conflict-box .v + .v{padding:2px 0 4px 10px;border-left:1px solid var(--rule-2)}
.conflict-box .v .micro{display:block}
.conflict-box ins{text-decoration:none;box-shadow:inset 0 -1px 0 var(--verm)}
.conflict-box .acts{grid-column:1 / -1;display:flex;gap:16px;margin-top:6px}

/* =====================================================================
   settings — the colophon
   ===================================================================== */
.col-title{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--rule)}

.col-toc a{text-decoration:none;color:var(--ink-2)} .col-toc a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.col-toc .n{color:var(--verm);font-family:var(--serif-sm);font-weight:600;margin-right:5px}

html[lang="zh-Hans"] .sec-h h2{font-family:var(--cjk);font-size:17px}
.sec-h h2 .sn{font-family:var(--serif-sm);font-size:13px;color:var(--verm);font-weight:600}
table.tab.reg td{font-size:13.5px;padding:7px 10px 7px 0;vertical-align:baseline}
table.tab.reg th{padding-right:10px}
.reg th{font-size:12px;color:var(--ink-3)}
.reg th.cap{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:0;padding-left:2px;padding-right:2px}
table.tab.reg td.cap{text-align:center;padding-left:2px;padding-right:2px;vertical-align:baseline}
table.tab.reg .cs{vertical-align:middle}
table.tab.reg td.pv{font-size:14.5px;color:var(--ink);white-space:nowrap}
table.tab.reg td.md{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.reg tr.use td.pv{font-weight:600}
.cs{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;color:var(--ink-3);vertical-align:middle}
.cs svg{width:12px;height:12px}
.cs.ver{color:var(--ink)}
.cs.fail{color:var(--verm)}
.ringg{display:block;width:9px;height:9px;border-radius:50%;border:1.2px solid currentColor}
.dashg{display:block;width:9px;height:1.2px;background:var(--ink-3)}
.key{font-size:13px;white-space:nowrap}
.key .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px}
.key.m{color:var(--ink-3)}
.statecell{font-size:13px;color:var(--ink-2);line-height:1.45}
.statecell > *{white-space:nowrap}
.statecell .when,.statecell .fail,.statecell .id{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.statecell .fail{color:var(--verm)}
.inuse{font-weight:600;color:var(--ink)}
.cap-legend{display:flex;gap:20px;font-size:12px;color:var(--ink-3);margin:9px 0 0;flex-wrap:wrap;align-items:center}
.cap-legend span{display:inline-flex;gap:6px;align-items:center}
.cap-legend .cs{width:auto;height:auto}
table.tab.bud td{font-size:14px;padding:8px 18px 7px 0;vertical-align:middle}
.tally{display:inline-flex;gap:3px;vertical-align:middle;height:12px;align-items:stretch}
.tally i{width:1px;background:var(--rule-2)}
.tally i.u{background:var(--ink);width:1.5px}
.bud tr.sum td{border-top:1px solid var(--ink);font-weight:600}
.small{font-size:13px;color:var(--ink-3);line-height:1.65;margin:8px 0 0}
html[lang="zh-Hans"] .small{line-height:1.75}
.consent-state{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.consent-state .s{font-size:15px}
.consent-state .s b{font-weight:600}
.events{list-style:none;margin:0;padding:0;font-size:13.5px}
.events li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.events li .when{font-variant-numeric:lining-nums tabular-nums;color:var(--ink-3);font-size:13px}

.dotst{display:inline-flex;align-items:center;gap:7px}

.dotst.ok i{background:var(--moss)} .dotst.bad i{border:1.4px solid var(--verm)} .dotst.off i{border:1.4px solid var(--ink-3)}
.dotst.bad{color:var(--verm)}

/* =====================================================================
   overlays — contents drawer, dialogs, toast
   ===================================================================== */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--desk) 60%,transparent);z-index:40;opacity:0;visibility:hidden;transition:opacity var(--d2) var(--ease),visibility 0s linear var(--d2)}
.scrim.on{opacity:1;visibility:visible;transition:opacity var(--d2) var(--ease)}
.drawer,.dlg{visibility:hidden;opacity:0;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease),visibility 0s linear var(--d2)}
.drawer.on,.dlg.on{visibility:visible;opacity:1;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.drawer{position:fixed;top:var(--head-h);left:50%;transform:translate(-50%,-8px);width:min(540px,90vw);background:var(--paper-raised);z-index:41;
  box-shadow:var(--shadow-sheet);border:1px solid var(--rule);border-top:0;padding:22px 32px 24px}

.drawer h2{margin:0 0 2px;font-family:var(--serif-hd);font-weight:600;font-size:20px}
html[lang="zh-Hans"] .drawer h2{font-family:var(--cjk)}

.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(480px,92vw);background:var(--paper-raised);z-index:42;box-shadow:var(--shadow-sheet);border:1px solid var(--rule);padding:24px 30px 22px}
.dlg.on{transform:translate(-50%,-50%)}
.dlg h2{margin:4px 0 10px;font-family:var(--serif-hd);font-size:21px;font-weight:600;line-height:1.3}
html[lang="zh-Hans"] .dlg h2{font-family:var(--cjk)}
.dlg p{margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--ink-2)}
html[lang="zh-Hans"] .dlg p{line-height:1.8}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.dlg.wide{width:min(780px,94vw)}
.keys{display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin-top:4px}
.keys h3{margin:14px 0 4px}
.keys dl{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px}
.keys dt,.keys dd{padding:4px 0;border-top:1px solid var(--rule);font-size:13.5px;margin:0}
.keys dt{display:flex;gap:4px;align-items:center;white-space:nowrap}
.dlg input[type=date],.dlg input[type=number]{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:6px 0;font-size:17px;width:200px;font-variant-numeric:lining-nums tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(var(--foot-h) + 18px);transform:translate(-50%,8px);background:var(--paper-raised);color:var(--ink);border:1px solid var(--rule-2);font-size:13.5px;padding:9px 16px;border-radius:var(--r1);z-index:50;opacity:0;pointer-events:none;transition:all var(--d2) var(--ease);box-shadow:var(--shadow-sheet)}
.toast.on{opacity:1;transform:translate(-50%,0)}
#errbar{position:fixed;left:0;right:0;top:0;z-index:99;background:#C0141B;color:#fff;font:13px/1.4 var(--mono);padding:8px 14px;display:none;white-space:pre-wrap}

/* =====================================================================
   motion — slow, quiet, page-like
   ===================================================================== */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.enter{animation:fadein 420ms var(--ease) both}
.mg .mnote{animation:fadein 700ms var(--ease) both}
.mg .mnote:nth-of-type(2){animation-delay:140ms}.mg .mnote:nth-of-type(3){animation-delay:280ms}.mg .mnote:nth-of-type(4){animation-delay:420ms}
.mg .mnote:nth-of-type(5){animation-delay:560ms}.mg .mnote:nth-of-type(6){animation-delay:700ms}.mg .mnote:nth-of-type(7){animation-delay:840ms}
/* a re-render on the same page never replays ink, rings or note fades */
main[data-settled] .enter,main[data-settled] .mnote,main[data-settled] .ev-key,main[data-settled] .struck s,main[data-settled] .ringmark ellipse,main[data-settled] .policy{animation:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
html.shot *,html.shot *::before,html.shot *::after{animation:none!important;transition:none!important;caret-color:transparent!important}
</style>

<body>
<div id="errbar" role="alert"></div>
<div id="app">
  <header class="runhead" id="head"></header>
  <main id="main" tabindex="-1"></main>
  <footer class="runfoot" id="foot"></footer>
</div>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" inert></nav>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" inert></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- visible error bar so a screenshot exposes JS failures ---------- */
function showErr(txt){var b=document.getElementById('errbar');b.style.display='block';b.textContent+=txt+'\n';}
window.onerror=function(msg,src,line,col){showErr('JS error: '+msg+' ('+(src||'').split('/').pop()+':'+line+':'+col+')');};
window.addEventListener('unhandledrejection',function(e){showErr('Unhandled rejection: '+(e.reason&&e.reason.message||e.reason));});

/* ---------- state ---------- */
const ROUTES=['today','practice','feedback','assess','report','anki','settings'];
const qs=new URLSearchParams(location.search);
const saved=(()=>{try{return JSON.parse(localStorage.getItem('pq-folio')||'{}')}catch(e){return {}}})();
const S={
  theme:qs.get('theme')||saved.theme||'light',
  lang:qs.get('lang')||saved.lang||'zh',
  shot:qs.get('shot')==='1',
  choice:null, assisted:false, hintOpen:false, skipAsk:false, pClock:41, marks:[],
  answered:'A', answeredAt:108, answeredCond:'ind',
  coach:'probe', coachVisited:{probe:true}, budget:4, pending:null,
  assess:{cur:17,ans:{},to:new Set([11]),left:34*60+12,item:52},
  annot:17,
  anki:{front:'all of the following are true EXCEPT',
        back1:'Three options match the passage; the answer is the one that does not. Check each option against the text — do not pick the one that repeats the most words.',
        back2:'Engineers will replace two of the four main pumps…',
        tactic:'NOT/EXCEPT polarity', width:'desktop', ctheme:null, state:'draft', conflict:'open'},
  consent:true, revokeAsk:false, events:[{when:'11-12 21:05',kind:'grant'}],
  examDate:null, dailyMin:null, brief:'paused', policy:false
};
if(!['light','dark'].includes(S.theme))S.theme='light';
if(!['zh','en'].includes(S.lang))S.lang='zh';
for(let i=1;i<=16;i++){if(i!==11)S.assess.ans[i]='ABCD'[(i*7+3)%4];}
S.assess.ans[17]='D';
if(S.shot)document.documentElement.classList.add('shot');
const persist=()=>{
  try{localStorage.setItem('pq-folio',JSON.stringify({theme:S.theme,lang:S.lang}))}catch(e){}
  /* keep the address in step with the toggles so a reload never reverts them */
  const q=new URLSearchParams(location.search);q.set('theme',S.theme);q.set('lang',S.lang);
  history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);
};
const t=(zh,en)=>S.lang==='zh'?zh:en;
const route=()=>{const r=(location.hash||'').replace(/^#\/?/,'');return ROUTES.includes(r)?r:'today'};

/* ---------- content ---------- */
const QS=[
 {skill:'not-except-polarity',stem:'According to the notice, all of the following are true EXCEPT that ____.',
  opts:['the South Station will supply water to the eastern district','drinking-water quality is tested twice a day','all four main pumps will be replaced','delivery vehicles must enter through the west gate'],key:2},
 {skill:'vocabulary-in-context',stem:'The phrase “under way” in Paragraph 3 most probably means ____.',opts:['in progress','on the road','delayed','being planned'],key:0},
 {skill:'sentence-structure',stem:'Why should questions be sent to the district office?',opts:['The district office manages the engineers.','The station’s phone line will not work during the project.','Visitors are not allowed on site.','The station will close permanently.'],key:1},
 {skill:'unclassified',stem:'What is one expected result of the project?',opts:['Water will taste better.','The station will use less electricity.','The eastern district will get a new station.','Fewer workers will be needed.'],key:1}
];
const L4='ABCD';
const EXPL={
  A:[ '第 1 段说由南站向东区供水。它重复的原文词最多——这正是 EXCEPT 题里词语重合会误导人的原因。',
      'Paragraph 1 says the South Station supplies the eastern district. It repeats the most passage words, which is exactly why keyword overlap misleads in an EXCEPT item.'],
  B:[ '原文说 <q lang="en">tested twice a day</q>。', 'The notice says <q>tested twice a day</q>.'],
  C:[ '四台主泵只换两台。这是唯一不符的说法，因此是答案。', 'Only two of the four pumps are replaced. This is the odd statement, so it is the key.'],
  D:[ '原文说 <q lang="en">Delivery vehicles must use the west gate</q>。', 'The notice says <q>Delivery vehicles must use the west gate</q>.']
};
const COACH={
  probe:['再看答案之前：选项 C 里，你会拿哪个词回原文核对？试试 <i>all</i>。第 2 段说的是四台中的两台，所以 C 是唯一没有原文支持的说法。A 让人放心，是因为它重复的原文词最多——但重复只说明词被搬了过来，不说明它成立。',
         'Before you look at the key again: which word in option C would you check against the passage? Try <i>all</i>. Paragraph 2 says <i>two of the four</i> pumps, so C is the one statement the notice does not support. A felt safe because it reuses the most passage words — but reuse shows copying, not truth.'],
  probeOk:['你选对了。换个角度验证：如果没有 <i>all</i> 这个词，你还能排除 A、B、D 吗？三项各有一句原文对应，C 的数量词与第 2 段的 <i>two of the four</i> 冲突——这才是它不成立的理由，而不是它“看着陌生”。',
         'You chose the key. Check the reason, not the result: without the word <i>all</i>, could you still rule out A, B and D? Each matches a sentence; C’s quantity clashes with <i>two of the four</i> in paragraph 2. That clash is why it is false — not that it looked unfamiliar.'],
  explain:['EXCEPT 题里，三个选项有原文支持，一个没有。A、B、D 各自对应原文中的一句；C 说四台全换，而第 2 段说只换四台中的两台。那个不成立的说法，就是答案。',
         'In an EXCEPT item, three options are supported by the notice and one is not. A, B and D each match a sentence. C says all four pumps; paragraph 2 says two of the four. The odd statement is the key.'],
  lesson:['EXCEPT 题三步：一，读题干，圈出 EXCEPT 或 NOT；二，逐个选项回原文找对应句，标“有支持”或“无支持”；三，选唯一无支持的那一项。留意数量词——<i>all</i>、<i>only</i>、<i>two of</i>——说法常在这里悄悄变假。',
         'EXCEPT items in three moves. One: circle EXCEPT or NOT in the stem. Two: find each option’s sentence and mark it supported or not. Three: choose the only unsupported one. Watch quantity words — <i>all</i>, <i>only</i>, <i>two of</i> — that is where a statement quietly turns false.']
};

/* ---------- icons (hand-made) ---------- */
const I={
  toc:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4h2M7 4h6.5M2.5 8h2M7 8h6.5M2.5 12h2M7 12h4.5"/></svg>',
  theme:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg>',
  lock:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="6.2" width="9" height="6" rx=".8"/><path d="M4.6 6.2V4.4a2.4 2.4 0 0 1 4.8 0v1.8"/></svg>',
  ext:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M5 2.5H2.5v7h7V7M7 2.5h2.5V5M9.3 2.7 5.5 6.5"/></svg>',
  /* proofreader's deleatur: a looped stroke, drawn by hand */
  dele:'<svg class="dele" viewBox="0 0 16 20" aria-hidden="true"><path d="M13 2.6C10.4 1 6.6 1.6 7.4 4.2c.6 1.9 4.9 3.6 5 7.6.1 3.2-2.4 5.4-5 5.3-2.7-.1-4.3-2.2-4-4.6.4-2.8 3.3-4.3 6.1-4"/></svg>',
  ring:'<svg class="ringmark" viewBox="0 0 30 26" aria-hidden="true"><ellipse cx="15" cy="13" rx="13" ry="11" pathLength="100"/></svg>',
  cross:'<svg class="glyph" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  check:'<svg class="glyph" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.4 4.8 9 9.8 3"/></svg>',
  clock:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.4V6l1.8 1.2"/></svg>',
  eq:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4.6h7M2.5 7.6h7"/></svg>',
  neq:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4.6h7M2.5 7.6h7M8 2 4 10"/></svg>',
  pencil:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2 10l.6-2.4L8.2 2l1.8 1.8-5.6 5.6z"/></svg>',
  arrowR:'<span class="arrow">→</span>', arrowL:'<span class="arrow">←</span>'
};
const cg=k=>`<i class="cg ${k}" aria-hidden="true"></i>`;

/* ---------- routes meta ---------- */
const META={
  today:{zh:'今日一页',en:'Today’s page'},
  practice:{zh:'阅读练习',en:'Reading practice'},
  feedback:{zh:'判分与批注',en:'Grading & notes'},
  assess:{zh:'计时测评',en:'Timed assessment'},
  report:{zh:'测评报告',en:'Assessment report'},
  anki:{zh:'Anki 卡片',en:'Anki notes'},
  settings:{zh:'设置',en:'Settings'}
};
const DESC={
  today:['下一步与证据','What’s next, and why'],practice:['独立作答，尚未判分','Answer before any help'],
  feedback:['答案键与教练批注','Key, evidence, coach'],assess:['无注释 · 计时','Unassisted · timed'],
  report:['同条件对比','Like-for-like'],anki:['提议、预览、同步','Propose, preview, sync'],
  settings:['模型、同意、预算','Models, consent, budget']
};
const roman=['i','ii','iii','iv','v','vi','vii'];
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')};

/* =====================================================================
   running head / foot
   ===================================================================== */
function head(r){
  const h=document.getElementById('head');
  const lang=`<button class="rh-btn lang-sw" data-act="lang" title="L"><span class="${S.lang==='zh'?'cur':''}" lang="zh-Hans">中</span><i aria-hidden="true"></i><span class="${S.lang==='en'?'cur':''}" lang="en">EN</span><span class="vh">${t('（切换语言）',' (switch language)')}</span></button>`;
  const theme=`<button class="rh-btn" data-act="theme" title="T">${I.theme}<span>${S.theme==='light'?t('日间','Day'):t('夜读','Night')}</span><span class="vh">${t('（切换明暗）',' (toggle light or dark)')}</span></button>`;
  if(r==='assess'){
    h.innerHTML=`<div class="frame"><div class="rh">
      <div class="rh-left"><span class="brand">Pass Quest</span><span class="rh-sep"></span><span class="rh-sec">${META.assess[S.lang]}</span></div>
      <div></div>
      <div class="rh-right">${lang}${theme}<button class="rh-btn" data-act="leave">${t('离开','Leave')} <kbd>Esc</kbd></button></div></div></div>`;
    return;
  }
  const exam=S.examDate?`<b class="tn">${S.examDate}</b>`:`<span>${t('未设置','not set')}</span><span class="dot">·</span><button class="link" data-act="set-exam">${t('去设置','Set it')}</button>`;

  <p id="pa2"><span class="pn" aria-hidden="true">2</span>${sp('C','Engineers will replace '+two+' main pumps')} and install a new control system. The old pumps have been in service since 1998 and use nearly 30 percent more electricity than modern models. Once the work is finished, the station is expected to run more quietly and to need fewer repairs.</p>

    : `<p class="condn">${cg('ind')}<span><b>${t('独立 · 新文章','Independent · fresh passage')}</b><br>${t('本次可计入独立迁移。','This attempt can count.')}</span></p>`;

      <div class="slip-actions">

/* =====================================================================
   FEEDBACK — the graded item first, then the proofed passage
   ===================================================================== */
function feedback(){
  const q=QS[0], ch=S.answered, key=L4[q.key], ok=ch===key, asst=S.answeredCond==='asst';
  const opts=q.opts.map((o,i)=>{
    const L=L4[i], isKey=L===key, isCh=L===ch;
    let cls='opt fb', an='';
    if(isKey&&isCh){cls+=' keyopt';an=t('答案 · 已核验 · 你的选择','key · verified · your choice')}
    else if(isKey){cls+=' keyopt';an=t('答案 · 已核验','key · verified')}
    else if(isCh){cls+=' struck';an=t('你的选择','your choice')}
    return `<li class="${cls}" data-opt="${L}">${isCh&&!isKey?I.dele:''}<span class="L">${isKey?I.ring:''}${L}</span><span class="tx"><span lang="en">${isCh&&!isKey?`<s>${o}</s>`:o}</span>${an?` <span class="an">${an}</span>`:''}</span></li>`;
  }).join('');
  const notes=L4.split('').map(L=>{
    const k=L===key;
    const hd=k?t('不成立 → 答案','Unsupported → the key'):t('成立','Supported');
    return note('ev-'+L,`<div class="mh"><b>${L}</b><span class="micro">${hd}</span></div><p>${EXPL[L][S.lang==='zh'?0:1]}</p>`,`opt-note lead ${k?'k':''}`,`data-opt="${L}"`);
  }).join('');
  const modes=[['explain',t('解释','Explain')],['probe',t('追问','Probe')],['lesson',t('微课','Micro-lesson')]];
  const ck=S.coach==='probe'&&ok?'probeOk':S.coach;
  const reply=!S.consent
    ? `<p class="coach-reply withheld">${t('未发送。S1 的同意已撤回，原文与题目不会发给 DeepSeek，也不扣预算。','Not sent. S1 consent is revoked, so the passage and item are withheld from DeepSeek and no budget is spent.')} <a class="link" href="#/settings">${t('在设置中重新授予','Grant again in Settings')}</a></p>`
    : S.pending?`<p class="coach-reply pending">${t('正在请求 DeepSeek…（外部调用，计入今日预算）','Asking DeepSeek… (external call, counts against today’s budget)')}</p>`
    :`<p class="coach-reply" ${S.lang==='zh'?'':'lang="en"'}>${COACH[ck][S.lang==='zh'?0:1]}</p>`;
  const sends=S.consent?t('题干、4 个选项、你的选择、已核验答案、证据句——来源 S1 第 24 页','stem, 4 options, your choice, verified key, evidence sentence — source S1 p.24'):`<span class="w">${t('不发送（S1 已撤回）','nothing — S1 withheld')}</span>`;
  const consent=S.consent?t('S1 · 你于 11-12 授予 · <a class="link" href="#/settings">可撤回</a>','S1 · granted by you on 11-12 · <a class="link" href="#/settings">revocable</a>'):`<span class="w">${t('S1 · 已撤回','S1 · revoked')}</span>`;
  const condTxt=asst?`${cg('asst')}<span>${t('有辅助 · 不计入','Assisted · does not count')}</span><span class="muted">· ${t('作答前显示过提示','a hint was shown before answering')}</span>`
    :`${cg('ind')}<span>${t('独立迁移 · 计入','Independent transfer · counts')}</span><span class="muted">· ${t('依据已审核答案键判分','graded by the reviewed key')}</span>`;
  return `<div class="leaf enter" id="leaf">
  <article class="tb" id="textcol">
    <section class="qblock" style="margin-top:0" id="verdict" aria-label="${t('判分','Grade')}">
      <span class="qn hang" aria-hidden="true">1</span>
      <div class="qhead">${ok?`<span class="vword">${t('答对','Correct')}</span>`:`<span class="vword wrong">${t('答错','Incorrect')}</span>`}<span class="vk">${t('你选','You chose')} <b>${ch}</b> · ${t('答案','Key')} <b>${key}</b></span><span class="sp"></span><span class="vt">${t('用时','Time')} <b class="tn">${fmt(S.answeredAt)}</b></span></div>

      <div class="tactic"><span class="micro">${t('解题策略','Tactic')}</span>
        <p><b style="font-weight:600">NOT/EXCEPT ${t('极性','polarity')}</b> — ${t('三个选项有原文支持，答案是那个不成立的；词语重合衡量的是词汇复用，不是真假。','three options are supported, the key is the odd one; word overlap measures vocabulary reuse, not truth.')}</p></div>
      <div class="nextsteps">
        <a class="imp" href="#/practice" data-act="next">${t('下一题 · 新文章，独立','Next · fresh passage, independent')} <kbd>N</kbd></a>

    ${note('verdict',`<section class="coach" aria-label="${t('教练批注（建议性）','Coach note (advisory)')}">
      <div class="mh"><span class="micro">${t('教练批注 · 建议性','Coach · advisory')}</span><span class="ext">${I.ext}${t('外部调用','External call')}</span></div>
      <p class="disc">DeepSeek · <span class="mono">deepseek-chat</span> · ${t('已验证','verified')} · ${t('今日','today')} <span class="tn">${S.budget}/20</span><br><span class="k">${t('发送','Sends')}</span> ${sends}<br><span class="k">${t('同意','Consent')}</span> ${consent}</p>

      ${reply}

    </section>`,'coachnote')}

  </aside>
  <svg class="leaders" id="leaders" aria-hidden="true"></svg>
  </div>`;
}

/* =====================================================================
   ASSESS — the exam paper: one column, margins emptied
   ===================================================================== */
function assess(){
  const A=S.assess, n=A.cur, q=QS[n%4], to=A.to.has(n), sel=A.ans[n];
  const answered=Object.keys(A.ans).length;
  const cells=Array.from({length:40},(_,i)=>{const k=i+1;const c=['cell'];if(A.ans[k])c.push('ans');if(A.to.has(k))c.push('to');if(k===n)c.push('cur');
    const st=A.to.has(k)?t('超时','timed out'):A.ans[k]?t('已答','answered'):t('未答','pending');
    return `<button class="${c.join(' ')}" data-goto="${k}" aria-label="${t('第 '+k+' 题，'+st,'Item '+k+', '+st)}${k===n?t('，当前',', current'):''}">${k}</button>`}).join('');
  return `<div class="leaf exam enter" id="leaf">
    <header class="exhead">
      <div><div class="ex-run">${t('测评 · 第 3 次','Assessment · run 3')}</div>
        <div class="ex-rules">${t('40 题 · 60 分钟 · 无注释、无提示、无词汇表、无 AI','40 items · 60 min · no annotations, hints, glossary or AI')}</div></div>
      <div class="ex-clocks">
        <div class="ck item"><span class="lbl">${t('本题','This item')}</span><span class="val"><span id="iclock">${fmt(A.item)}</span> <span class="of">/ 1:30</span></span><span class="bar"><i id="ibar" style="width:${Math.min(100,A.item/90*100)}%"></i></span></div>
        <div class="ck"><span class="lbl">${t('全卷剩余','Run time left')}</span><span class="val" id="rclock">${fmt(A.left)}</span><span class="bar"><i style="width:${A.left/3600*100}%"></i></span></div>
      </div>
    </header>
    <div class="ex-strip">
      <div class="row1"><span class="itemno"><button class="stepb" data-act="aprev" ${n<=1?'disabled':''} aria-label="${t('上一题','Previous item')}">${I.arrowL}</button>${t('第 <b class="tn">'+n+'</b> 题 / 40','Item <b class="tn">'+n+'</b> of 40')}<button class="stepb" data-act="anext" ${n>=40?'disabled':''} aria-label="${t('下一题','Next item')}">${I.arrowR}</button></span>
        <span class="legend"><span><i class="cell ans">8</i>${t('已答','answered')} <b class="tn">${answered}</b></span><span><i class="cell to">11</i>${t('超时','timed out')} <b class="tn">${A.to.size}</b></span><span><i class="cell">23</i>${t('未答','pending')} <b class="tn">${40-answered-A.to.size}</b></span><span><i class="cell cur">${n}</i>${t('当前','current')}</span></span></div>
      <div class="cells" role="group" aria-label="${t('答题卡（不显示对错）','Answer sheet (no right or wrong)')}">${cells}</div>
    </div>
    <article>
      <div class="p-kicker ex-k"><h1 class="p-title" lang="en">Temporary Closure of the North Pump Station</h1><span class="micro"><span lang="en">Passage C</span> · ${t('第 17–20 题','items 17–20')}</span></div>
      ${passage('exam')}
    </article>
    <section class="qblock" aria-label="${t('第 '+n+' 题','Item '+n)}">
      <span class="qn hang" aria-hidden="true">${n}</span>
      <p class="stem" lang="en">${q.stem}</p>
      <ol class="omr" role="radiogroup" aria-label="${t('第 '+n+' 题选项','Item '+n+' options')}">${q.opts.map((o,i)=>`<li class="${sel===L4[i]?'sel':''} ${to?'locked':''}" role="radio" aria-checked="${sel===L4[i]}" ${to?'aria-disabled="true"':''} tabindex="${(sel?sel===L4[i]:i===0)?0:-1}" data-ans="${L4[i]}"><span class="L">${L4[i]}</span><span lang="en">${o}</span></li>`).join('')}</ol>
      <p class="nofb">${to?t('本题已超时，不能再作答。','This item timed out and is closed.'):t('作答后不显示对错；全卷结束后在报告中查看。','No right or wrong is shown after answering; see the report when the run ends.')}</p>
    </section>
  </div>`;
}

  const rows=[
    ['NOT/EXCEPT 极性','NOT/EXCEPT polarity','not-except-polarity',7,10,'1101110t11'],
    ['语境词义','Vocabulary in context','vocabulary-in-context',9,14,'11011t10101101'],
    ['句子结构','Sentence structure','sentence-structure',8,12,'1101t1101011'],
    ['未分类推断','Unclassified inference','unclassified',3,4,'1101']
  ];
  const tr=rows.map(r=>`<tr><td><span class="skill-n">${t(r[0],r[1])}</span><span class="tag">${r[2]}</span></td>
     <td>${strip(r[5])}</td><td class="r"><span class="frac"><b>${r[3]}</b><span class="of"> / ${r[4]}</span></span>${r[4]<10?'<sup class="fn">3</sup>':'<span style="display:inline-block;width:.5em"></span>'}</td></tr>`).join('');
  const wrong=[3,8,11,14,17,19,22,25,29,31,34,36,39];
  const X=v=>`${(v/40*100).toFixed(2)}%`;
  const det={
    17:t('<b>第 17 题</b> · 证据：第 3 段 <i lang="en">while the work is under way</i> · 推理：<i lang="en">under way</i> 与 <i lang="en">while … the work</i> 连用，指“正在进行”。','<b>Item 17</b> · Evidence: paragraph 3, <i>while the work is under way</i> · Reasoning: paired with <i>while … the work</i>, it means “in progress”.'),
  };
  const d=det[S.annot]||t(`<b>第 ${S.annot} 题</b> · 证据句与推理已开放；原型中仅展示第 17 题的全文。`,`<b>Item ${S.annot}</b> · Evidence and reasoning are now open; the prototype shows item 17 in full.`);

  <article class="tb">
    <div class="dateline" id="r-date"><span class="chapter">${t('测评报告 · 第 3 次','Assessment report · run 3')}</span><span class="d tn">${t('11 月 13 日','13 November')}</span></div>
    <div class="score" id="r-score">
      <span class="big">27<span class="of"> / 40</span></span>
      <span class="cap">${t('答对 · 计时、无辅助，','correct · timed, unassisted,')}<br>${t('全部为未见过的题','all on unseen items')}</span>
    </div>
    <p class="pass-unknown"><span>${t('及格线：<b>未知</b>','Pass threshold: <b>unknown</b>')}<sup class="fn">1</sup></span><span class="muted" style="font-size:13.5px">${t('— 不给出概率，也不下结论','— no probability, no verdict')}</span></p>
    <table class="tab" style="margin-top:18px" id="r-table">
      <thead><tr><th><span class="micro">${t('技能','Skill')}</span></th><th><span class="micro">${t('逐题','Per item')}</span></th><th class="r"><span class="micro">${t('答对','Correct')}</span></th></tr></thead>
      <tbody>${tr}</tbody>
    </table>
    <p class="small" style="margin-top:6px">${t('逐题刻度：长＝答对，短＝答错，朱红＝超时。','Per-item ticks: tall = correct, short = missed, vermilion = timed out.')}</p>
    <p class="timeline" id="r-time">${t(`用时中位数 <b class="tn">64</b><span class="u">秒</span>，p90 <b class="tn">112</b><span class="u">秒</span>；超时 <b class="tn">3</b> 题；污染 <b class="tn">0</b> 题。<sup class="fn">2</sup>`,
      `Median time <b class="tn">64</b><span class="u">s</span>, p90 <b class="tn">112</b><span class="u">s</span>; <b class="tn">3</b> timed out; <b class="tn">0</b> contaminated.<sup class="fn">2</sup>`)}</p>
    <section class="withheld" id="r-withheld">
      <div class="ledger-h"><h2>${t('暂缓的注释，现已开放','Withheld notes, now open')}</h2><span class="micro">${t('答错或超时的 13 题','13 missed or timed out')}</span></div>
      <p class="wnums">${wrong.map(k=>`<button aria-pressed="${S.annot===k}" data-annot="${k}">${k}</button>`).join('<span aria-hidden="true">&thinsp;</span>')}</p>
      <div class="annot-detail" aria-live="polite">${d}</div>
    </section>
    <div class="fnotes">
      <p><span class="fnm">1</span><span>${t('真实考试的及格线、题型分布与考试日期都尚未确认。本报告只陈述观测到的正确数、用时与错误类型，不给出通过概率、准备度或预测分数。','The real exam’s pass line, blueprint and date are not confirmed. This report states observed correct counts, time and failure modes only — no pass probability, readiness or predicted score.')}</span></p>
      <p><span class="fnm">2</span><span>${t('测评开始前已见过的题会在这里逐题列出，并排除出得分。本次没有。','Items seen before the run would be listed here one by one and excluded from the score. There were none.')}</span></p>
      <p><span class="fnm">3</span><span>${t('n < 10：样本太少，比例不稳定，所以这里只给计数。','n < 10: too few items for a stable proportion, so only the count is given.')}</span></p>
    </div>
  </article>
  <aside class="mg" data-notes aria-label="${t('页边注','Margin notes')}">
    ${note('r-score',`<div class="mh"><span class="micro">${t('同条件对比 · 与第 2 次（11-11）','Like-for-like · vs run 2 (11-11)')}</span></div>
      <div class="cmp-axis">
        <span class="ax"></span>
        ${[0,10,20,30,40].map(v=>`<span class="tk" style="left:${X(v)}"></span><span class="tl tn" style="left:${X(v)}">${v}</span>`).join('')}
        <span class="seg" style="left:${X(22)};width:calc(${X(27)} - ${X(22)})"></span>
        <span class="pt" style="left:${X(22)}"></span><span class="pt n" style="left:${X(27)}"></span>
        <span class="pl" style="left:${X(18.5)}">${t('第 2 次','Run 2')} <b class="tn">22</b></span><span class="pl" style="left:${X(31.5)}">${t('第 3 次','Run 3')} <b class="tn">27</b></span>
      </div>
      <p style="display:flex;gap:10px;align-items:baseline;margin-top:6px"><span class="delta">+5</span><span>${t('题 · 同样题量、同样 60 分钟、同一题库系列','items · same size, same 60-minute window, same pool family')}</span></p>
      <ul class="checks">
        <li>${I.check}<span>${t('题量','Size')}</span><span class="eq tn">40 = 40</span></li>
        <li>${I.check}<span>${t('时长','Window')}</span><span class="eq tn">60 = 60 ${t('分钟','min')}</span></li>
        <li>${I.check}<span>${t('题库系列','Pool family')}</span><span class="eq">${t('相同','same')}</span></li>
        <li>${I.check}<span>${t('注释','Annotations')}</span><span class="eq">${t('无 = 无','none = none')}</span></li>
      </ul>
      <p class="muted" style="margin-top:6px">${t('两次各用不同的未见题。任一条件不同时，对比会被拒绝，并写明是哪一条。','Each run used different unseen items. If any condition differed, the comparison would be refused, naming which one.')}</p>`)}
    ${note('r-time',`<div class="mh"><span class="micro">${t('测评后题库','Pool after the run')}</span></div><p>${t('未见 <span class="tn">23</span> 题 / <span class="tn">7</span> 个单元；下限 20 题。','<span class="tn">23</span> items / <span class="tn">7</span> units unseen; floor 20 items.')}</p>`)}
    ${note('r-withheld',`<div class="mh"><span class="micro">${t('本次测评','This run')}</span></div><p>${t('第 3 次 · 40 题 · 60 分钟 · 测评中无注释、提示、词汇表与 AI。','Run 3 · 40 items · 60 minutes · no annotations, hints, glossary or AI during the run.')}</p>`)}
  </aside>
  </div>`;
}

/* =====================================================================
   ANKI — a printed index card, proof fields, sync ledger
   ===================================================================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cardHTML(){
  const A=S.anki, dk=(A.ctheme||S.theme)==='dark', ph=A.width==='phone';
  const front=esc(A.front).replace(/\b(EXCEPT|NOT)\b/g,'<em>$1</em>');
  const ex=esc(A.back2).replace('two of the four','<b>two of the four</b>');
  const cls=`icard ${dk?'dk':''} ${ph?'ph':''}`;
  const w=ph?t('手机 · 卡宽 <span class="tn">300</span> px','Phone · card <span class="tn">300</span> px'):t('桌面 · 卡宽 <span class="tn">440</span> px','Desktop · card <span class="tn">440</span> px');
  const L=S.lang==='zh'?'zh-Hans':'en';
  return `<div class="cardw ${ph?'phone':''}"><div class="wl"><span>${t('正面','Front')}</span><span>${w}</span></div>
    <div class="${cls}" lang="en"><div class="ch"><span class="t" id="cv-tac">${esc(A.tactic)}</span><span class="s">S1 · p024 · q1</span></div>
      <div class="front" id="cv-front">${front}</div>
      <div class="cf" lang="${L}"><span>Pass Quest</span><span>${t('先想，再翻面','Think, then turn')}</span></div></div></div>
  <div class="cardw ${ph?'phone':''}"><div class="wl"><span>${t('背面','Back')}</span><span></span></div>
    <div class="${cls}" lang="en"><div class="ch"><span class="t">${esc(A.tactic)}</span><span class="s">S1 · p024 · q1</span></div>
      <div class="back"><span class="lab" lang="${L}">${t('为什么','Why')}</span><p id="cv-b1">${esc(A.back1)}</p><span class="lab" lang="${L}">${t('例句','Example')}</span><p class="ex" id="cv-b2">${ex}</p></div></div></div>`;
}
const ST={
  pushed:()=>`<span class="st">${I.check.replace('class="glyph" ','')}${t('已推送','pushed')}</span>`,
  queued:(x)=>`<span class="st">${I.clock}${x||t('排队','queued')}</span>`,
  present:()=>`<span class="st">${I.eq}${t('已存在','already present')}</span>`,
  conflict:()=>`<span class="st conflict">${I.neq}${t('冲突','conflict')}</span>`,
  draft:(x)=>`<span class="st">${I.pencil}${x}</span>`
};
function anki(){
  const A=S.anki, dis=A.state!=='draft'?'disabled':'';
  const stateLine={draft:t('草稿 · 未接受','Draft · not accepted'),accepted:t('已接受 · 修订 1 · 排队中（Anki 未运行）','Accepted · revision 1 · queued (Anki not running)'),skipped:t('已跳过 · 不会创建','Skipped · nothing created')}[A.state];
  const conflict=A.conflict==='open'?`<li style="border-bottom:0" id="cf-row"><span class="fr" lang="en">when demand is highest</span>${ST.conflict()}
      <div class="conflict-box">
        <div class="v"><span class="micro">${t('你的版本','Yours')}</span><span lang="en">demand — the amount people want or use</span></div>
        <div class="v"><span class="micro">${t('Anki 中（你改过）','In Anki (you edited)')}</span><span lang="en">demand — <ins lang="zh-Hans">需求；用水最多的时候</ins></span></div>
        <div class="acts"><button class="link" data-conf="mine">${t('保留我的','Keep mine')}</button><button class="link" data-conf="anki">${t('保留 Anki 的','Keep Anki’s')}</button></div>
      </div></li>`
    :`<li><span class="fr" lang="en">when demand is highest</span>${A.conflict==='mine'?ST.queued(t('已解决 · 保留我的 · 排队','resolved · mine · queued')):ST.pushed().replace(t('已推送','pushed'),t('已解决 · 保留 Anki 的','resolved · kept Anki’s'))}</li>`;
  const pushed=['under way → in progress','rather than (A, not B)','in service since 1998','be expected to do','reflective vests','until the work is complete'];
  const refineSends=S.consent?t('正面、解释、例句、解题策略四个字段','front, explanation, example and tactic'):t('正面、解释、解题策略三个字段（例句出自 S1，同意已撤回，不发送）','front, explanation and tactic (the example comes from S1; consent is revoked, so it is withheld)');
  return `<div class="leaf enter" id="leaf">
  <div class="wide">
    <div class="dateline"><span class="chapter">${t('Anki 卡片 · 来自第 1 题的错误','Anki note · from the item 1 miss')}</span><span class="d">${stateLine}</span></div>
    <div class="plate-h"><span class="micro">${t('印刷预览','Printed preview')}</span>
      <span class="ctl">
        <span class="tog" role="group" aria-label="${t('宽度','Width')}"><button aria-pressed="${A.width==='desktop'}" data-w="desktop">${t('桌面','Desktop')}</button><span class="d">·</span><button aria-pressed="${A.width==='phone'}" data-w="phone">${t('手机','Phone')}</button></span>
        <span class="tog" role="group" aria-label="${t('卡片明暗','Card theme')}"><button aria-pressed="${(A.ctheme||S.theme)==='light'}" data-ct="light">${t('浅色卡','Light card')}</button><span class="d">·</span><button aria-pressed="${(A.ctheme||S.theme)==='dark'}" data-ct="dark">${t('深色卡','Dark card')}</button></span>
      </span></div>
    <div class="plate" id="stage">${cardHTML()}</div>
  </div>
  <section class="tb" aria-label="${t('卡片草稿','Note draft')}" style="margin-top:22px">
    <label class="field"><span class="fl micro">${t('正面','Front')}</span><input id="f-front" lang="en" value="${esc(A.front)}" ${dis}></label>

/* =====================================================================
   margin-note layout + leaders
   Each note sits level with the line it annotates; if the previous note
   is in the way it drops below it. Leaders (on .lead notes) run from the
   end of the anchored line, through the ragged-right white, to the note.
   ===================================================================== */
function lineEnd(a,r){
  const blk=a.closest('p,li,h1,div')||a;const rg=document.createRange();rg.selectNodeContents(blk);
  let x=r.right;const cy=r.top+r.height/2;
  for(const q of rg.getClientRects()){if(q.width>0&&cy>=q.top&&cy<=q.bottom)x=Math.max(x,q.right);}
  return x;
}
function layoutNotes(){
  const leaf=$('#leaf'); if(!leaf)return;
