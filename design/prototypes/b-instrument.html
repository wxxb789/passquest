<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Quest — Instrument</title>
<script>
/* Visible error bar so headless screenshots expose JS failures. */
window.onerror = function (msg, src, line, col) {
  var b = document.getElementById('errbar') || document.createElement('div');
  b.id = 'errbar';
  b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#c62828;color:#fff;font:600 13px/20px Consolas,monospace;padding:6px 12px';
  b.textContent = 'JS ERROR: ' + msg + ' @' + line + ':' + col;
  (document.body || document.documentElement).appendChild(b);
};
</script>
<style>
/* =====================================================================
   DESIGN SYSTEM — "Instrument"
   Grid: 4px. Hairlines: 1px. Radii: 2 / 3 / 6. Motion: 140ms exact.
   ===================================================================== */
:root {
  --f-ui: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --f-label: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Small", -apple-system, "Noto Sans SC", "PingFang SC", sans-serif;
  --f-mono: "Cascadia Mono", "SF Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans SC", monospace;
  --f-read: "Sitka Text", "Iowan Old Style", Charter, Georgia, "Noto Serif SC", "Songti SC", serif;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r1: 2px; --r2: 3px; --r3: 6px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 120ms; --t: 150ms; --t-slow: 180ms;

  --rail: 216px; --insp: 328px; --top: 44px; --foot: 28px;
}

/* ---------- Semantic hue map (locked) ----------
   amber  = live · timing · attention (clocks, current position, the one next action, assisted/queued warnings)
   teal   = verified · admitted (reviewed key, verified provider, consent granted, "counts as evidence")
   red    = error · incorrect · unreachable · conflict · failed
   violet = AI output only (advisory text and the call that produces it)
   correct answers, deltas, budgets and selections stay in graphite ink with a glyph or sign.  */

/* ---------- Graphite (dark, hero) ---------- */
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0C0F;
  --s-1: #101317;     /* bezel: top bar, rail, status strip */
  --s-2: #14181D;     /* recessed control field */
  --s-3: #1B2026;     /* raised field */
  --s-4: #232930;     /* hover / pressed */
  --z-work: #0C0F12;  /* work surface: the darkest, quietest well for reading */
  --z-insp: #13171B;  /* inspector: a lit instrument panel */
  --well: #11151A;    /* grouped readouts inside the work surface */
  --card: #1A1F25;    /* readout cards inside the inspector */
  --paper: #161B20;   /* answer options, primary cards */
  --lift: inset 0 1px 0 rgba(255, 255, 255, .035);
  --hair: #222930;
  --hair-2: #2E363E;
  --tick: #46505A;
  --ctl: #59646F;     /* control boundary (letter chips) */
  --ink: #E6EAEE;
  --ink-2: #AEB7C0;
  --ink-3: #87929C;
  --ink-inv: #0B0E11;
  --amber: #F0A443;   --amber-bg: rgba(240, 164, 67, .09);  --amber-ln: rgba(240, 164, 67, .42);
  --teal: #4CCBC0;    --teal-bg: rgba(76, 203, 192, .08);   --teal-ln: rgba(76, 203, 192, .38);
  --red: #F2766A;     --red-bg: rgba(242, 118, 106, .09);   --red-ln: rgba(242, 118, 106, .42);
  --violet: #B2A7E4;  --violet-bg: rgba(178, 167, 228, .07); --violet-ln: rgba(178, 167, 228, .34);
  --hatch: rgba(230, 234, 238, .06);
  --hl: rgba(76, 203, 192, .15);
  --mark: rgba(240, 164, 67, .22);
  --pri: #2A3139; --pri-hi: #323A43; --pri-ln: #4A545E; --pri-ink: #F1F4F6;
  --shadow-pop: 0 0 0 1px var(--hair-2), 0 24px 64px rgba(0, 0, 0, .6), 0 4px 12px rgba(0, 0, 0, .45);
}
/* ---------- Lab white (light) ---------- */
[data-theme="light"] {
  color-scheme: light;
  --bg: #E2E6EA;
  --s-1: #ECEFF2;
  --s-2: #F7F8FA;
  --s-3: #FFFFFF;
  --s-4: #E5E9ED;
  --z-work: #F9FAFB;
  --z-insp: #F2F4F6;
  --well: #F0F2F5;
  --card: #FFFFFF;
  --paper: #FFFFFF;
  --lift: 0 1px 0 rgba(17, 22, 27, .035);
  --hair: #D7DDE3;
  --hair-2: #C2CAD2;
  --tick: #98A3AE;
  --ctl: #8A95A0;
  --ink: #11161B;
  --ink-2: #3B4550;
  --ink-3: #56616C;
  --ink-inv: #FFFFFF;
  --amber: #945300;   --amber-bg: rgba(181, 106, 0, .08);   --amber-ln: rgba(148, 83, 0, .40);
  --teal: #006C68;    --teal-bg: rgba(0, 108, 104, .07);    --teal-ln: rgba(0, 108, 104, .36);
  --red: #B3322A;     --red-bg: rgba(179, 50, 42, .07);     --red-ln: rgba(179, 50, 42, .38);
  --violet: #5B4BAA;  --violet-bg: rgba(91, 75, 170, .06);  --violet-ln: rgba(91, 75, 170, .32);
  --hatch: rgba(17, 22, 27, .06);
  --hl: rgba(0, 128, 122, .12);
  --mark: rgba(214, 140, 20, .24);
  --pri: #151A20; --pri-hi: #2B333C; --pri-ln: #151A20; --pri-ink: #FFFFFF;
  --shadow-pop: 0 0 0 1px var(--hair-2), 0 24px 56px rgba(22, 32, 44, .18), 0 4px 12px rgba(22, 32, 44, .08);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 14px/20px var(--f-ui);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: "tnum" 1;
  text-autospace: normal;
  overflow: hidden;
}
html[lang="zh-CN"] body { letter-spacing: .01em; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
::selection { background: var(--mark); color: inherit; }
:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; border-radius: var(--r1); }
.read-en { font-variant-numeric: lining-nums proportional-nums; font-feature-settings: "lnum" 1, "pnum" 1; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums slashed-zero; letter-spacing: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- micro-labels ---------- */
.ml {
  font: 600 10.5px/16px var(--f-label); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); font-stretch: 100%;
}
html[lang="zh-CN"] .ml { font: 600 11.5px/16px var(--f-ui); letter-spacing: .16em; text-transform: none; font-feature-settings: "tnum" 1; }
.ml b { color: var(--ink-2); font-weight: 600; }
.ml .en { font-family: var(--f-label); letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; }

/* ---------- application frame ---------- */
.app {
  display: grid; height: 100vh;
  grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp);
  grid-template-rows: var(--top) minmax(0, 1fr) var(--foot);
  grid-template-areas: "top top top" "rail work insp" "foot foot foot";
}
.top { grid-area: top; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp); align-items: center;
  background: var(--s-1); border-bottom: 1px solid var(--hair); position: relative; }
.rail { grid-area: rail; background: var(--s-1); border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; }
.work { grid-area: work; background: var(--z-work); min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.insp { grid-area: insp; background: var(--z-insp); border-left: 1px solid var(--hair); min-height: 0; overflow: auto; overscroll-behavior: contain; }
.foot { grid-area: foot; background: var(--s-1); border-top: 1px solid var(--hair); display: flex; align-items: center; gap: var(--s5); padding: 0 var(--s4); min-width: 0; overflow: hidden; }

/* top bar */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 var(--s4); height: 100%; border-right: 1px solid var(--hair); }
.brand svg { color: var(--ink); flex: none; }
.brand .wm { font: 700 12px/1 var(--f-label); letter-spacing: .2em; text-transform: uppercase; }
.brand .wm small { display: block; font: 500 9.5px/1 var(--f-label); letter-spacing: .18em; color: var(--ink-3); margin-top: 3px; }
.top-mid { display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s8); min-width: 0; }
.cmdk { flex: 1; display: flex; align-items: center; gap: 10px; height: 30px; min-width: 0; padding: 0 6px 0 10px;
  border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--s-2); color: var(--ink-3); font-size: 13px; text-align: left;
  transition: border-color var(--t) var(--ease), background var(--t) var(--ease); }
.cmdk:hover { border-color: var(--tick); color: var(--ink-2); }
.cmdk span.grow { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk .recent { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; justify-content: flex-end; }
.cmdk .recent .ml { margin-right: 2px; }
.cmdk .recent .rc { font-size: 12px; color: var(--ink-3); padding: 0 7px; height: 20px; display: inline-flex; align-items: center; border-radius: var(--r1); background: var(--s-4); }
.cmdk .recent .rc + .rc { margin-left: 0; }
.cmdk.sealed { border-style: dashed; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--hatch) 4px 5px), var(--s-2); }
.top-right { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); padding: 0 var(--s4); height: 100%; border-left: 1px solid var(--hair); }
.seg { display: inline-flex; border: 1px solid var(--hair-2); border-radius: var(--r2); height: 26px; background: var(--s-2); }
.seg button { border: 0; background: transparent; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3);
  font: 600 11px/1 var(--f-label); letter-spacing: .08em; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.seg button:first-child { border-radius: 2px 0 0 2px; } .seg button:last-child { border-radius: 0 2px 2px 0; }
.seg button:focus-visible { outline-offset: -2px; }
.seg button + button { border-left: 1px solid var(--hair-2); }
.seg button[aria-pressed="true"] { background: var(--pri); color: var(--pri-ink); }
[data-theme="dark"] .seg button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--pri-ln); }
.seg button:not([aria-pressed="true"]):hover { color: var(--ink); background: var(--s-4); }
.seg .zh { font: 600 12px/1 var(--f-ui); letter-spacing: 0; }
.iconbtn { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--s-2); color: var(--ink-2); font: 600 12px/1 var(--f-mono); }
.iconbtn:hover { color: var(--ink); border-color: var(--tick); }

kbd, .kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--hair-2); border-bottom-width: 2px; border-radius: var(--r1); background: var(--s-3);
  font: 500 10.5px/1 var(--f-mono); color: var(--ink-2); letter-spacing: 0; white-space: nowrap;
}
.kgrp { display: inline-flex; gap: 3px; align-items: center; }

/* ---------- rail ---------- */
.rail-sec { padding: var(--s4) 0 var(--s2); }
.rail-sec + .rail-sec { border-top: 1px solid var(--hair); }
.rail-h { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s4) var(--s2); }
.ch { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 32px; padding: 0 var(--s3) 0 var(--s4);
  color: var(--ink-2); text-decoration: none; position: relative; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.ch:hover { background: var(--s-4); color: var(--ink); }
.ch .ix { font: 500 10.5px/1 var(--f-mono); color: var(--ink-3); }
.ch .lb { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch[aria-current="page"] { color: var(--ink); background: var(--s-3); box-shadow: var(--lift); }
.ch[aria-current="page"] .lb { font-weight: 600; }
.ch[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--ink); }
.ch[aria-current="page"] .ix { color: var(--ink); }
.ch .kgrp kbd { opacity: .75; }
/* SEALED: channels become inert behind a 45° hatch; only the run itself stays live */
.sealed-rail { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--hatch) 5px 6px), var(--s-1); }
.sealed-rail .ch.locked-ch { color: var(--ink-3); cursor: not-allowed; }
.sealed-rail .ch.locked-ch:hover { background: transparent; color: var(--ink-3); }
.sealed-rail .ch.locked-ch .lb { font-weight: 400; }
.ch .lk { color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font: 500 9.5px/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; }
html[lang="zh-CN"] .ch .lk { font: 500 10.5px/1 var(--f-ui); letter-spacing: .08em; }
.sealed-rail .ch[aria-current="page"] { background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber-ln); }
.sealed-rail .ch[aria-current="page"]::before { background: var(--amber); }
.sealed-rail .ch[aria-current="page"] .ix { color: var(--amber); }
.rail-seal { margin: 4px var(--s4) 0; padding: 10px 12px; border: 1px dashed var(--amber-ln); border-radius: var(--r2); font-size: 12px; line-height: 18px; color: var(--ink-2); background: var(--s-1); }
.rail-seal .ml { color: var(--amber); display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.q-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; padding: 7px var(--s4); align-items: start; }
.q-item .dots { margin-top: 5px; }
.q-item .dot { width: 7px; height: 7px; }
.q-item .dot.gap { height: 9px; }
.q-item .n { font: 500 10.5px/18px var(--f-mono); color: var(--ink-3); }
.q-item .t { font-size: 12.5px; line-height: 18px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item .t code { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0; }
.q-item.now .t code { color: var(--ink); }
.q-item .s { font: 500 10.5px/16px var(--f-mono); color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.q-item.now .n { color: var(--amber); }
.rail-foot { margin-top: auto; border-top: 1px solid var(--hair); padding: var(--s3) var(--s4) var(--s4); }
.dayro { display: flex; align-items: baseline; justify-content: space-between; }
.dayro .v { font: 300 30px/36px var(--f-mono); letter-spacing: -.02em; }
.dayro .v small { font: 400 11px/1 var(--f-ui); color: var(--ink-3); letter-spacing: 0; margin-left: 4px; }
.ruler { height: 8px; margin: 6px 0 6px; background:
  repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 8px) bottom / 100% 4px no-repeat,
  repeating-linear-gradient(90deg, var(--ink-3) 0 1px, transparent 1px 40px) bottom / 100% 8px no-repeat; }
.rail-foot .meta { font-size: 12px; line-height: 18px; color: var(--ink-3); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.rail-foot .meta b { text-align: right; }
.rail-foot .meta b { color: var(--ink-2); font-weight: 500; }

/* ---------- status strip ---------- */
.lampi { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; color: var(--ink-2); }
.lampi .k { color: var(--ink-3); }
.lampi .mono { font-size: 11.5px; }
.foot .div { width: 1px; height: 12px; background: var(--hair-2); flex: none; }
.foot .right { margin-left: auto; display: flex; gap: var(--s3); align-items: center; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.lamp { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; position: relative; background: var(--ink-3); }
.lamp.ok { background: var(--teal); box-shadow: 0 0 0 3px var(--teal-bg); }
.lamp.warn { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-bg); }
.lamp.err { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
.lamp.ai { background: var(--violet); box-shadow: 0 0 0 3px var(--violet-bg); }
.lamp.off { background: transparent; border: 1px solid var(--ink-3); }
.lamp.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid currentColor; animation: pulse .6s var(--ease) 1; opacity: 0; }
.lamp.ok.pulse { color: var(--teal); } .lamp.warn.pulse { color: var(--amber); } .lamp.err.pulse { color: var(--red); }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
.chord { font: 500 11px/1 var(--f-mono); color: var(--amber); }

/* ---------- inspector ---------- */
.insp-h { position: sticky; top: 0; z-index: 2; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s4);
  background: var(--z-insp); border-bottom: 1px solid var(--hair); }
.insp-h.sealed { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--amber-bg) 5px 6px), var(--z-insp); border-bottom-color: var(--amber-ln); }
.insp-h .t { display: flex; align-items: center; gap: 8px; }
.isec { padding: var(--s4); border-bottom: 1px solid var(--hair); }
.isec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); gap: 8px; }
.isec-h .ml { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.isec-h > .ml:first-child::before { content: ""; width: 6px; height: 1px; background: var(--ink-3); }
.isec-h > .ml + .ml { letter-spacing: .06em; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; line-height: 18px; }
html[lang="zh-CN"] .kv { grid-template-columns: 76px minmax(0, 1fr); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.kv dd .mono { font-size: 11.5px; }
.note { font-size: 12px; line-height: 18px; color: var(--ink-3); margin: var(--s2) 0 0; text-wrap: pretty; }
.cond-sub, .reply p, .fopt .ex, .kv dd, .qcell .d, .dlg-b, .tactic { text-wrap: pretty; }
html[lang="zh-CN"] .note { line-height: 20px; }

/* condition panel — the reading everybody asks for */
.cond { border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--card); box-shadow: var(--lift); position: relative; overflow: hidden; }
.cond-top { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px; }
.cond-top .name { font-weight: 600; font-size: 15px; letter-spacing: .005em; }
.cond-top .tag { margin-left: auto; }
.cond-sub { padding: 0 12px 12px 29px; font-size: 12.5px; color: var(--ink-2); line-height: 18px; }
.cond.counts { border-color: var(--teal-ln); }
.cond.counts::before, .cond.assisted::before, .cond.sealed::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--teal); }
.cond.assisted { border-color: var(--amber-ln); } .cond.assisted::before { background: var(--amber); }
.cond.sealed { border-color: var(--amber-ln); } .cond.sealed::before { background: var(--amber); }
.cond-scale { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--hair); }
.cond-scale span { font: 500 10px/1 var(--f-label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 7px 0 7px; text-align: center; position: relative; white-space: nowrap; }
html[lang="zh-CN"] .cond-scale span { font: 500 11px/1 var(--f-ui); letter-spacing: .04em; }
.cond-scale span + span { border-left: 1px solid var(--hair); }
.cond-scale span.on { color: var(--ink); background: var(--s-3); }
.cond-scale span.on::after { content: ""; position: absolute; left: 50%; top: -1px; width: 7px; height: 4px; transform: translateX(-50%); background: currentColor; clip-path: polygon(0 0, 100% 0, 50% 100%); }

/* readouts */
.ros { display: grid; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--card); box-shadow: var(--lift); }
.ros > .ro { padding: 10px 12px 11px; min-width: 0; }
.ros > .ro + .ro { border-left: 1px solid var(--hair); }
.ro .v { font: 400 20px/28px var(--f-mono); letter-spacing: -.01em; white-space: nowrap; }
.ro .v small { font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.ro .n { font-size: 11.5px; line-height: 16px; color: var(--ink-3); margin-top: 2px; }
.ro.live .v { color: var(--amber); }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border-radius: var(--r1); border: 1px solid var(--hair-2);
  font: 500 11px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; letter-spacing: 0; background: var(--s-2); }
.tag.t-teal { color: var(--teal); border-color: var(--teal-ln); background: var(--teal-bg); }
.tag.t-amber { color: var(--amber); border-color: var(--amber-ln); background: var(--amber-bg); }
.tag.t-red { color: var(--red); border-color: var(--red-ln); background: var(--red-bg); }
.tag.t-violet { color: var(--violet); border-color: var(--violet-ln); background: var(--violet-bg); }
.tag.t-ghost { border-style: dashed; color: var(--ink-3); background: transparent; }
.tag.t-word { font-family: var(--f-ui); font-size: 11.5px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r2); border: 1px solid var(--hair-2);
  background: var(--s-3); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), transform var(--t-fast) var(--ease); }
.btn:hover { border-color: var(--tick); background: var(--s-4); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--pri); color: var(--pri-ink); border-color: var(--pri-ln); }
.btn.pri:hover { background: var(--pri-hi); border-color: var(--pri-ln); }
.btn.pri kbd { background: transparent; color: var(--pri-ink); border-color: color-mix(in srgb, var(--pri-ink) 34%, transparent); }
[data-theme="dark"] .btn.pri { box-shadow: var(--lift); }
.btn.pri.next-go { box-shadow: inset 2px 0 0 var(--amber), var(--lift); padding-left: 14px; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; gap: 6px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--s-4); color: var(--ink); }
.btn.warn { color: var(--amber); border-color: var(--amber-ln); background: var(--amber-bg); }
.btn.danger { color: var(--red); border-color: var(--red-ln); background: transparent; }
.btn.ai { color: var(--violet); border-color: var(--violet-ln); background: var(--violet-bg); }
.btn[disabled] { opacity: .42; cursor: not-allowed; }
.btn.pri[disabled] { background: var(--s-4); color: var(--ink-3); border-color: var(--hair-2); opacity: 1; }
.btn.pri[disabled] kbd { color: var(--ink-3); border-color: var(--hair-2); }
.link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--tick); text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; }
.link:hover { text-decoration-color: var(--ink); }

/* ---------- work area ---------- */
.wk-h { flex: none; height: 52px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s8); border-bottom: 1px solid var(--hair); min-width: 0; }
.wk-h h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
html[lang="zh-CN"] .wk-h h1 { letter-spacing: .03em; }
.wk-h .ml { white-space: nowrap; }
.crumb { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.crumb .cp { font: 400 11.5px/16px var(--f-mono); color: var(--ink-3); letter-spacing: 0; }
.crumb .sep { width: 10px; height: 1px; background: var(--tick); flex: none; }
.wk-h .vr { width: 1px; height: 20px; background: var(--hair-2); flex: none; }
.wk-h .aside { margin-left: auto; display: flex; align-items: center; gap: var(--s3); white-space: nowrap; }
.wk-b { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.pad { padding: var(--s5) var(--s8) var(--s8); }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 var(--s3); }
.sec-h .ml { white-space: nowrap; }
.sec-h .rule { flex: 1; height: 1px; background: var(--hair); }
.sec-h .aside { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-3); white-space: nowrap; }

/* ---------- today ---------- */
.unkline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); }
.unkline > div { padding: 8px 16px 9px; min-width: 0; }
.unkline > div + div { border-left: 1px solid var(--hair); }
.unkline .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.unkline .h .link { font-size: 12px; }
.unkline .v { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--ink); font-weight: 600; white-space: nowrap; min-width: 0; }
.unkline .v span.n { font-weight: 400; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.unkbox { display: inline-block; flex: none; width: 28px; height: 12px; border: 1px dashed var(--tick); border-radius: 1px;
  background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hair) 3px 4px); }

/* the one next action — a policy-trace readout, not a callout */
.next { margin-top: var(--s4); border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--paper); box-shadow: var(--lift); position: relative; overflow: hidden; }
.next-h { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--hair); position: relative; }
.next-h::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 5px; pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 8px) bottom / 100% 3px no-repeat,
              repeating-linear-gradient(90deg, var(--ink-3) 0 1px, transparent 1px 40px) bottom / 100% 5px no-repeat; opacity: .7; }
.next-h .ml.go-l { color: var(--amber); display: inline-flex; align-items: center; gap: 6px; }
.next-h .grow { flex: 1; }
.next-b { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.next-main { padding: 16px 24px 18px 20px; min-width: 0; }
.next-main h2 { margin: 0 0 8px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.012em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
html[lang="zh-CN"] .next-main h2 { letter-spacing: .02em; }
.next-main .ids { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.next-main .reason { margin: 12px 0 16px; font-size: 14.5px; line-height: 24px; color: var(--ink-2); max-width: 60ch; text-wrap: pretty; }
html[lang="zh-CN"] .next-main .reason { line-height: 26px; letter-spacing: .02em; }
.next-main .reason .num { color: var(--ink); font-weight: 600; }
.next-main .go { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.forecast { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.next-trace { border-left: 1px solid var(--hair); padding: 14px 18px 14px; background: var(--well); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.trace-rank { display: grid; gap: 8px; }
.trace-rank .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--ink-3); }
.trace-rank .r .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); font-size: 11px; display: flex; align-items: center; gap: 6px; }
.trace-rank .r.sel { color: var(--ink); }
.trace-rank .r .v { font-family: var(--f-mono); font-size: 11.5px; text-align: right; }
.trace-rank .r .v small { color: var(--ink-3); font-size: 10.5px; margin-left: 6px; }
.meter { grid-column: 1 / -1; height: 8px; position: relative; background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 25%) bottom / 100% 8px no-repeat; border-bottom: 1px solid var(--hair-2); }
.meter i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ink-3); }
.sel .meter i { background: var(--amber); }
.sel .meter b { position: absolute; bottom: -5px; width: 0; height: 0; border: 4px solid transparent; border-bottom-color: var(--amber); transform: translateX(-4px); }

.skills { margin-top: var(--s4); }
.stable { width: 100%; border-collapse: collapse; font-size: 13px; }
.stable th { text-align: left; font-weight: 400; padding: 0 12px 8px 0; border-bottom: 1px solid var(--hair-2); white-space: nowrap; }
.stable td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.stable tr:last-child td { border-bottom: 0; }
.stable .sk { display: grid; gap: 0; line-height: 18px; }
.stable .sk b { font-weight: 600; font-size: 13.5px; }
.stable .sk span { font: 400 11.5px/16px var(--f-mono); color: var(--ink-3); }
.stable .num { font-size: 12.5px; }
.stable .dim { color: var(--ink-3); }

.dots { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
.dot { width: 10px; height: 10px; border-radius: 1px; display: inline-block; flex: none; }
.dot.ic { background: var(--teal); }                                   /* independent · correct */
.dot.im { box-shadow: inset 0 0 0 1.5px var(--teal); }                 /* independent · miss */
.dot.ac { background: var(--ink-3); opacity: .55; }                    /* assisted (not counted) */
.dot.am { box-shadow: inset 0 0 0 1.5px var(--ink-3); opacity: .7; }
.dot.re { background: repeating-linear-gradient(135deg, var(--ink-3) 0 1.5px, transparent 1.5px 3.5px); opacity: .8; }
.dot.gap { width: 1px; height: 14px; background: var(--hair-2); margin: 0 4px; border-radius: 0; }
.legend { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--ink-3); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.quiet { margin-top: var(--s4); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); }
.qcell { padding: 9px 16px 10px; min-width: 0; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.qcell:nth-child(3n) { border-right: 0; }
.qcell:nth-last-child(-n+3) { border-bottom: 0; }
.qcell .qh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
.qcell .qh .ml { min-width: 0; }
.qcell .qh .link { font-size: 12px; white-space: nowrap; }
.qcell .qv { display: flex; align-items: center; gap: 14px; min-width: 0; }
.qcell .qv .units, .qcell .qv .steps6 { flex: 1; min-width: 72px; margin: 0; }
.qcell .big { font: 400 17px/24px var(--f-mono); white-space: nowrap; }
.steps6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.steps6 i { height: 4px; background: var(--hair-2); }
.steps6 i.d { background: var(--ink-3); }
.steps6 i.p { background: var(--amber); }
.qcell .big small { font: 400 12px/1 var(--f-ui); color: var(--ink-3); margin-left: 2px; }
.qcell .d { font-size: 12px; line-height: 18px; color: var(--ink-3); margin-top: 2px; }
html[lang="zh-CN"] .qcell .d { line-height: 19px; }
.qcell .d b { color: var(--ink-2); font-weight: 500; }
.qcell .acts { display: flex; gap: 6px; margin-top: 8px; }
/* unit strip: one segment per assessment unit; hatched = spent */
.units { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; align-items: end; }
.units i { height: 10px; background: var(--ink-3); opacity: .8; }
.units i.sp { opacity: 1; background: repeating-linear-gradient(135deg, var(--tick) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 0 0 1px var(--hair-2); }
.units i.run { opacity: 1; background: repeating-linear-gradient(135deg, var(--ink-3) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 0 0 1px var(--ink-3); }
.units-lg { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--ink-3); flex-wrap: wrap; }
.units-lg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.units-lg i { width: 8px; height: 8px; display: inline-block; }

/* ---------- reading ---------- */
.read { display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(0, 1fr); min-height: 100%; }
.passage { padding: var(--s5) var(--s8) var(--s8) var(--s12); border-right: 1px solid var(--hair); min-width: 0; position: relative; }
.passage .src { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.passage h2 { font: 600 20px/26px var(--f-read); margin: 0; letter-spacing: -.003em; color: var(--ink); text-wrap: balance; }
.passage .disc { font-size: 11.5px; line-height: 16px; color: var(--ink-3); margin: 6px 0 14px; display: flex; gap: 6px; align-items: center; }
.para { position: relative; margin: 0 0 14px; font: 400 16px/26px var(--f-read); color: var(--ink); hyphens: manual; text-wrap: pretty; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1, "pnum" 1; }
.para .pn { position: absolute; left: -32px; top: 8px; font: 500 10px/1 var(--f-mono); color: var(--ink-3); width: 14px; text-align: right; }
.para .pn::after { content: ""; position: absolute; left: 20px; top: -3px; width: 1px; height: 16px; background: var(--tick); }
.ev { background: var(--hl); box-shadow: inset 0 -1.5px 0 var(--teal); padding: 1px 0; border-radius: 1px; }
.ev b { font-weight: 700; }
mark.mk { background: var(--mark); color: inherit; border-radius: 1px; box-shadow: inset 0 -1px 0 var(--amber); }
.item { padding: var(--s5) var(--s8) var(--s8) var(--s6); min-width: 0; display: flex; flex-direction: column; }
.item-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stem { font: 500 16px/24px var(--f-ui); margin: 0 0 16px; color: var(--ink); letter-spacing: -.003em; font-feature-settings: "lnum" 1; text-wrap: pretty; }
.stem b { font-weight: 700; letter-spacing: .02em; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 24px minmax(0, 1fr) 12px; gap: 12px; align-items: center; padding: 9px 12px 9px 10px; border: 1px solid var(--hair-2); border-radius: var(--r2);
  background: var(--paper); box-shadow: var(--lift); text-align: left; font: 400 15px/22px var(--f-ui); color: var(--ink); width: 100%; min-height: 44px;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.opt:hover { border-color: var(--ctl); }
.opt .L { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--ctl); border-radius: var(--r1); background: var(--s-2);
  font: 600 12px/1 var(--f-mono); color: var(--ink); transition: all var(--t-fast) var(--ease); }
.opt .k2 { font: 500 11px/1 var(--f-mono); color: var(--ink-3); text-align: right; }
.opt[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt[aria-checked="true"] .L { background: var(--ink); color: var(--ink-inv); border-color: var(--ink); }
.actbar { margin-top: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.actbar .navgrp { display: inline-flex; gap: 4px; flex: none; }
/* the passage's other items — a quiet list, no correctness */
.sibs { margin-top: 28px; border-top: 1px solid var(--hair); padding-top: 12px; }
.sibs .sec-h { margin-bottom: 6px; }
.sib { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--hair); font-size: 12.5px; color: var(--ink-2); }
.sib:last-child { border-bottom: 0; }
.sib .q { font: 600 11px/1 var(--f-mono); color: var(--ink-3); }
.sib.now .q { color: var(--ink); }
.sib .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sib .mono { font-size: 11px; color: var(--ink-3); }
.actbar .sp { flex: 1; }
.hintbox { margin-top: 12px; border: 1px dashed var(--hair-2); border-radius: var(--r2); padding: 10px 12px; font-size: 13px; line-height: 20px; color: var(--ink-2); background: repeating-linear-gradient(135deg, transparent 0 5px, var(--hatch) 5px 6px); }
.hintbox .ml { color: var(--ink-2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.markpop { position: absolute; z-index: 30; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; border-radius: var(--r2);
  background: var(--ink); color: var(--ink-inv); font-size: 12.5px; box-shadow: var(--shadow-pop); transform: translate(-50%, -100%); margin-top: -8px; white-space: nowrap; }
.markpop button { border: 0; background: transparent; color: inherit; display: inline-flex; gap: 6px; align-items: center; height: 24px; padding: 0 6px; border-radius: var(--r1); }
.markpop button:hover { background: color-mix(in srgb, var(--ink-inv) 14%, transparent); }
.markpop kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--ink-inv) 40%, transparent); }

/* feedback */
.verdict { display: grid; grid-template-columns: 1.25fr 1fr .85fr; gap: 0; border: 1px solid var(--hair-2); border-radius: var(--r2); margin-bottom: 14px; background: var(--well); }
.verdict > div { padding: 8px 12px 9px; border-right: 1px solid var(--hair); min-width: 0; }
.verdict .ml { white-space: nowrap; }
.verdict > div:nth-child(3) { border-right: 0; }
.verdict > .vc { grid-column: 1 / -1; border-right: 0; border-top: 1px solid var(--hair); display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 12.5px; color: var(--ink-2); }
.verdict > .vc b { color: var(--ink); font-weight: 600; }
.verdict .v { font: 500 15px/22px var(--f-mono); display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
.verdict .v small { font: 400 12px/1 var(--f-ui); color: var(--ink-3); }
.verdict .v.bad { color: var(--red); }
.verdict .v.good { color: var(--ink); }
.fopt { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 4px 12px; padding: 10px 12px 11px 10px; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--paper); box-shadow: var(--lift); }
.fopt + .fopt { margin-top: 6px; }
.fopt .L { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--ctl); border-radius: var(--r1); background: var(--s-2); font: 600 12px/1 var(--f-mono); color: var(--ink); }
.fopt .tx { font: 400 14.5px/24px var(--f-ui); }
.fopt .ex { grid-column: 2; font-size: 12.5px; line-height: 19px; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
html[lang="zh-CN"] .fopt .ex { line-height: 20px; }
.fopt .ex .tv { font: 600 10px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); flex: none; width: 34px; }
html[lang="zh-CN"] .fopt .ex .tv { font: 600 11px/1 var(--f-ui); letter-spacing: .04em; }
.fopt .flags { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 2px; }
.fopt.key { border-color: var(--teal-ln); background: linear-gradient(90deg, var(--teal-bg), transparent 70%), var(--paper); }
.fopt.key .L { background: var(--teal); color: var(--ink-inv); border-color: var(--teal); }
.fopt.key .ex .tv { color: var(--teal); }
.fopt.mine { border-color: var(--red-ln); }
.fopt.mine .L { border-color: var(--red); color: var(--red); }
.tactic { margin-top: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 14px; border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); font-size: 13px; line-height: 20px; color: var(--ink-2); }
.tactic svg { color: var(--ink-3); margin-top: 2px; }
.tactic b { color: var(--ink); font-weight: 600; }

/* AI coach (inspector) */
.coach { border: 1px solid var(--violet-ln); border-radius: var(--r2); background: var(--violet-bg); }
.coach-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--violet-ln); }
.coach-h .who { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.coach-h .who > span { overflow: hidden; text-overflow: ellipsis; }
.coach-h .who svg { flex: none; color: var(--violet); }
.coach-h .mono { font-size: 11px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--violet-ln); }
.modes button { border: 0; background: transparent; padding: 8px 4px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; justify-content: center; align-items: center; position: relative; white-space: nowrap; min-width: 0; }
.modes button:focus-visible { outline-offset: -2px; }
.modes button + button { border-left: 1px solid var(--violet-ln); }
.modes button[aria-selected="true"] { color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--violet-bg) 100%, var(--s-3) 40%); }
.modes button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--violet); }
.modes .mk3 { font: 500 10px/1 var(--f-mono); color: var(--ink-3); border: 1px solid var(--hair-2); border-radius: 1px; padding: 2px 3px; }
.modes button[aria-selected="true"] .mk3 { color: var(--violet); border-color: var(--violet-ln); }
.reply { padding: 12px 12px 10px; font-size: 13px; line-height: 21px; color: var(--ink); }
html[lang="zh-CN"] .reply { line-height: 23px; }
.reply p { margin: 0 0 8px; }
.reply .q { color: var(--violet); font-weight: 600; }
.reply-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px 9px; font: 400 11.5px/16px var(--f-ui); white-space: nowrap; color: var(--ink-3); border-top: 1px dashed var(--violet-ln); }
.manifest { margin-top: 12px; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--card); box-shadow: var(--lift); font-size: 12px; }
.manifest .row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--hair); line-height: 18px; }
html[lang="en"] .manifest .row { grid-template-columns: 70px minmax(0, 1fr); }
.manifest .row:last-child { border-bottom: 0; }
.manifest .row > span:first-child { color: var(--ink-3); }
.payload { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.payload li { display: inline-flex; gap: 4px; align-items: baseline; white-space: normal; overflow-wrap: anywhere; min-width: 0; }
.payload li svg { flex: none; position: relative; top: 1px; }
.payload li.meta { display: block; flex-basis: 100%; color: var(--ink-3); font: 400 10.5px/15px var(--f-mono); margin-top: 3px; overflow-wrap: anywhere; white-space: normal; }
.payload li.wh { color: var(--ink-3); }
.payload li.wh svg { color: var(--red); }
.budget { display: flex; gap: 2px; margin-top: 4px; }
.budget i { flex: 1; height: 6px; background: var(--hair-2); }
.budget i.u { background: var(--ink-2); }
.budget i.nx { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-3); }

/* ---------- assessment ---------- */
.sealband { flex: none; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 var(--s8); border-bottom: 1px solid var(--amber-ln);
  background: repeating-linear-gradient(135deg, transparent 0 6px, var(--amber-bg) 6px 7px), var(--z-work); position: relative; }
.sealband::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--amber); opacity: .7; }
.sealband h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; }
.sb-t { display: grid; gap: 2px; min-width: 0; }
.sb-t .ml { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-r { margin-left: auto; display: flex; gap: 0; align-items: stretch; min-width: 0; height: 44px; }
.sb-ro { display: grid; align-content: center; padding: 0 18px; border-left: 1px solid var(--hair-2); min-width: 0; }
.sb-ro .ml { line-height: 14px; }
.sb-ro .v { font: 400 24px/28px var(--f-mono); letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sb-ro .v small { font-size: 13px; color: var(--ink-3); letter-spacing: 0; }
.sb-ro.live .v { color: var(--amber); font-size: 28px; }
.sb-leave { display: grid; align-content: center; padding-left: 18px; border-left: 1px solid var(--hair-2); }
.sealmark { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--amber); color: var(--amber); border-radius: var(--r1);
  font: 700 10.5px/1 var(--f-label); letter-spacing: .18em; white-space: nowrap; flex: none; }
html[lang="zh-CN"] .sealmark { font: 700 11.5px/1 var(--f-ui); letter-spacing: .2em; }
.nav40 { padding: 12px var(--s8) 10px; border-bottom: 1px solid var(--hair); background: var(--z-work); }
.nav40 .cells { display: grid; grid-template-columns: repeat(40, minmax(0, 1fr)); gap: 3px; }
.nav40 .c { height: 22px; border: 1px solid var(--hair-2); border-radius: 1px; background: transparent; padding: 0; position: relative; }
.nav40 .c.ans { background: var(--ink-3); border-color: var(--ink-3); opacity: .7; }
.nav40 .c.to { background: linear-gradient(to top right, transparent calc(50% - .75px), var(--ink-2) calc(50% - .75px), var(--ink-2) calc(50% + .75px), transparent calc(50% + .75px)); border-color: var(--ink-3); }
.nav40 .c.cur { border-color: var(--amber); background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber); }
.nav40 .c:hover { border-color: var(--ink); }
.nav40 .scale { display: grid; grid-template-columns: repeat(40, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
.nav40 .scale span { font: 500 9.5px/12px var(--f-mono); color: var(--ink-3); text-align: center; position: relative; }
.nav40 .scale span.tk::before { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 3px; background: var(--tick); }
.nav40 .lg { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sealed-item .opt[aria-checked="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.sealed-item .opt[aria-checked="true"] .L { background: var(--amber); border-color: var(--amber); color: var(--ink-inv); }
.locked { display: grid; gap: 0; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--card); box-shadow: var(--lift); }
.locked > div { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; font-size: 12.5px; color: var(--ink-3); }
.locked.seal > div { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hatch) 3px 4px); }
.locked.seal .sl { font: 600 9.5px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--hair-2); padding: 3px 5px; border-radius: 1px; background: var(--card); }
html[lang="zh-CN"] .locked.seal .sl { font: 500 10.5px/1 var(--f-ui); letter-spacing: .08em; }
.locked > div + div { border-top: 1px solid var(--hair); }
.locked .mono { font-size: 10.5px; }
.clockwrap { display: grid; grid-template-columns: 156px minmax(0, 1fr); gap: 14px; align-items: center; }
.clockwrap svg text { font-family: var(--f-mono); }
.bigclock { font: 300 40px/44px var(--f-mono); letter-spacing: -.03em; color: var(--ink); }
.runbar { display: flex; gap: 1px; margin-top: 8px; }
.runbar i { flex: 1; height: 8px; background: var(--hair-2); }
.runbar i.u { background: var(--ink-3); }
.runbar i.n { background: var(--amber); }

/* ---------- report ---------- */
.headline { display: grid; grid-template-columns: 1.1fr 1fr 1fr; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--paper); box-shadow: var(--lift); }
.headline > div { padding: 14px 18px 16px; min-width: 0; }
.headline > div + div { border-left: 1px solid var(--hair); }
.headline .hv { font: 300 44px/52px var(--f-mono); letter-spacing: -.04em; display: flex; align-items: baseline; gap: 6px; }
.headline .hv small { font-size: 18px; color: var(--ink-3); letter-spacing: -.02em; }
.headline .hv.unk { font: 500 18px/52px var(--f-ui); letter-spacing: 0; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.headline .hv .delta { color: var(--ink); }
.headline .n { font-size: 12px; color: var(--ink-3); line-height: 18px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s8); margin-top: var(--s6); }
.skrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--hair); }
html[lang="zh-CN"] .skrow { grid-template-columns: 150px minmax(0, 1fr) 44px; }
.skrow:last-child { border-bottom: 0; }
.skrow .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skrow .nm span { display: block; font: 400 10.5px/14px var(--f-mono); color: var(--ink-3); }
.skrow .v { font: 500 13px/1 var(--f-mono); text-align: right; }
.cellbar { display: flex; gap: 2px; }
.cellbar i { width: 12px; height: 14px; border: 1px solid var(--hair-2); border-radius: 1px; }
.cellbar i.c { background: var(--ink-2); border-color: var(--ink-2); }
.histo svg { display: block; width: 100%; height: auto; overflow: visible; }
.histo text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-3); }
.histo .bar { fill: var(--ink-3); opacity: .55; }
.histo .bar.hi { fill: var(--ink-2); opacity: .9; }
.cmp { margin-top: var(--s6); border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); }
.cmp-main { padding: 14px 18px 12px; }
.cmp-side { border-top: 1px solid var(--hair); padding: 10px 18px 12px; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; background: var(--z-work); }
.cmp-side > .ml { margin-right: 4px; }
.cmp-side .note { flex-basis: 100%; margin: 0 !important; }
.cmp-bars { display: grid; gap: 10px; margin-top: 10px; }
.cmp-bars .r { display: grid; grid-template-columns: 88px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 12.5px; }
.cmp-bars .r .v { font: 500 13px/1 var(--f-mono); text-align: right; }
.track40 { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; }
.track40 i { height: 12px; background: var(--hair); border-radius: 0; }
.track40 i.c { background: var(--ink-3); opacity: .55; }
.track40.now i.c { opacity: .9; }
.track40 i.dl { background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink-2); position: relative; }
.track40 i.dl::after { content: ""; position: absolute; left: 0; right: 0; top: -5px; height: 2px; background: var(--ink-2); }
.track40 i.dl + i.dl::after { left: -2px; }
.chk { display: inline-grid; grid-template-columns: 14px auto auto; gap: 6px; align-items: center; font-size: 12px; }
.chk .mono { font-size: 11px; color: var(--ink-2); }
.items40 { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; }
.items40 button { height: 30px; padding: 0 0 0 1px; border: 1px solid var(--hair-2); border-radius: 1px; background: var(--paper); font: 500 10.5px/1 var(--f-mono); color: var(--ink-2); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.items40 button svg { width: 9px; height: 9px; }
.items40 button.c svg { color: var(--ink-3); }
.items40 button.x { border-color: var(--red-ln); color: var(--red); background: var(--red-bg); }
.items40 button.to { color: var(--ink-3); background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hair) 3px 4px); }
.items40 button.to .g { font: 600 8px/1 var(--f-mono); }
.items40 button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink), 0 2px 0 -1px var(--ink); color: var(--ink); }
.items40 button:hover { border-color: var(--ctl); }
.annot { margin-top: 12px; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--paper); box-shadow: var(--lift); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; font-size: 12.5px; line-height: 19px; }
.annot .ml { margin-bottom: 4px; }
.annot .rd { font: 400 14px/22px var(--f-read); color: var(--ink); font-feature-settings: "lnum" 1; }
.annot .q { font: 500 13.5px/21px var(--f-ui); color: var(--ink); }

/* ---------- anki ---------- */
.anki-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--s6); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { display: flex; justify-content: space-between; align-items: center; }
.field input, .field textarea { width: 100%; border: 1px solid var(--hair-2); border-radius: var(--r2); background: var(--paper); box-shadow: var(--lift); padding: 7px 10px; font-size: 14px; line-height: 22px; resize: none; color: var(--ink); text-overflow: ellipsis;
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.field textarea { font-size: 14px; line-height: 22px; field-sizing: content; min-height: calc(2 * 22px + 16px); overflow: hidden; }
.field input.mono { font-size: 12.5px; font-family: var(--f-mono); }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink-2) 16%, transparent); }
.field .cnt { font: 400 10.5px/1 var(--f-mono); color: var(--ink-3); letter-spacing: 0; }
.field .s1 { display: inline-flex; gap: 6px; align-items: center; }
.field input[readonly] { background: var(--s-1); color: var(--ink-2); }
.previewbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.stage { border: 1px solid var(--hair); border-radius: var(--r2); padding: 20px; display: grid; place-items: center; min-height: 300px; position: relative;
  background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 16px), repeating-linear-gradient(0deg, var(--hair) 0 1px, transparent 1px 16px), var(--s-1); background-blend-mode: normal; }
.stage .dim { position: absolute; left: 10px; bottom: 8px; font: 500 10px/1 var(--f-mono); color: var(--ink-3); }
/* the Anki card — its own small design: a "calibration slip" */
.card { --c-bg: #FBFBF8; --c-ink: #15191D; --c-mute: #5B646D; --c-line: #DCE0E3; --c-acc: #9A5600; --c-key: #006E6A;
  width: 100%; max-width: 460px; background: var(--c-bg); color: var(--c-ink); border-radius: 4px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 30px rgba(20,30,40,.12), 0 0 0 1px var(--c-line);
  font-family: var(--f-ui); overflow: hidden; transition: max-width var(--t-slow) var(--ease); }
.card.dark { --c-bg: #161A1F; --c-ink: #E9ECEF; --c-mute: #9AA4AE; --c-line: #2A3138; --c-acc: #F2A541; --c-key: #4ACFC4; box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 0 1px var(--c-line); }
.card.phone { max-width: 300px; }
.card .ct { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--c-line); font: 600 9.5px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; color: var(--c-mute); }
.card .ct i { font-style: normal; color: var(--c-acc); }
.card .cticks { height: 6px; background: repeating-linear-gradient(90deg, var(--c-line) 0 1px, transparent 1px 8px); }
.card .cf { padding: 22px 20px 24px; font: 500 22px/30px var(--f-read); letter-spacing: -.005em; }
.card.phone .cf { font-size: 19px; line-height: 27px; padding: 18px 16px 20px; }
.card .cf .pol { color: var(--c-acc); font-weight: 700; letter-spacing: .02em; }
.card .cb { padding: 0 20px 18px; border-top: 1px solid var(--c-line); }
.card.phone .cb { padding: 0 16px 16px; }
.card .cb p { margin: 14px 0 0; font-size: 13.5px; line-height: 21px; }
.card .cb .eg { font-family: var(--f-read); font-size: 14px; line-height: 22px; padding-left: 12px; border-left: 2px solid var(--c-key); color: var(--c-ink); }
.card .cb .eg b { color: var(--c-key); }
.card .cs { display: flex; justify-content: space-between; padding: 9px 16px; border-top: 1px solid var(--c-line); font: 500 10.5px/1 var(--f-mono); color: var(--c-mute); }
.notes { margin-top: var(--s6); }
.nrow { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) minmax(0, .9fr) 96px 190px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 12.5px; }
.nrow .f { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; color: var(--ink); }
.nrow .src { font: 400 11.5px/1 var(--f-mono); color: var(--ink-3); }
.nrow .st { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.nrow > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nrow .ix { font: 500 10.5px/1 var(--f-mono); color: var(--ink-3); }
.conflict { margin: 6px 0 4px 34px; border: 1px solid var(--red-ln); border-radius: var(--r2); display: grid; grid-template-columns: 1fr 1fr; }
.conflict > div { padding: 10px 12px; min-width: 0; }
.conflict > div + div { border-left: 1px solid var(--red-ln); }
.conflict .tx { font: 400 13.5px/20px var(--f-ui); margin: 4px 0 10px; }
.conflict .tx del { color: var(--red); text-decoration-thickness: 1px; }
.conflict .tx ins { text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; color: var(--ink); font-weight: 600; }
.conflict .chosen { box-shadow: inset 0 0 0 2px var(--ink-2); }

/* ---------- settings ---------- */
.reg { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.reg th { text-align: left; font-weight: 400; padding: 0 10px 8px 0; border-bottom: 1px solid var(--hair-2); white-space: nowrap; vertical-align: bottom; }
.reg td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--hair); vertical-align: middle; white-space: nowrap; }
.reg tr.inuse td { background: var(--teal-bg); }
.reg tr.inuse td:first-child { box-shadow: inset 2px 0 0 var(--teal); padding-left: 10px; }
.reg td:first-child, .reg th:first-child { padding-left: 10px; }
.reg .pv { font-weight: 600; font-size: 13px; }
.reg .md { font: 400 12px/1 var(--f-mono); }
.caps { display: inline-grid; grid-template-columns: repeat(5, 34px); gap: 2px; justify-items: center; }
.cap { width: 14px; height: 14px; border-radius: 1px; border: 1px solid var(--hair-2); position: relative; }
.cap.v { background: var(--teal); border-color: var(--teal); }
.cap.d { border-color: var(--ink-3); border-style: dashed; }
.cap.u { background: linear-gradient(to top right, transparent calc(50% - .5px), var(--tick) calc(50% - .5px), var(--tick) calc(50% + .5px), transparent calc(50% + .5px)); }
.cap.f { border-color: var(--red); background: var(--red-bg); }
.capsh { display: inline-grid; grid-template-columns: repeat(5, 34px); gap: 2px; }
.capsh span { font: 500 10px/14px var(--f-mono); color: var(--ink-3); text-align: center; letter-spacing: 0; cursor: help; }
.cred { display: inline-flex; align-items: center; gap: 6px; font: 400 11.5px/1 var(--f-mono); }
.set-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s8); margin-top: var(--s6); }
.ledger { border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); }
.ledger .lev { display: grid; grid-template-columns: 76px 14px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--hair); font-size: 12.5px; line-height: 18px; align-items: start; }
.ledger .lev:last-of-type { border-bottom: 0; }
.ledger .lev .t { font: 400 11px/18px var(--f-mono); color: var(--ink-3); }
.ledger .lev .ln { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; }
.ledger .foot2 { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-top: 1px solid var(--hair); background: var(--z-work); gap: 10px; }
.bud { display: grid; gap: 8px; }
.bud .r { display: grid; grid-template-columns: 76px minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 12.5px; }
.bud .r .v { font: 400 12px/1 var(--f-mono); text-align: right; }
.bud .ticks20 { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.bud .ticks20 i { height: 10px; background: var(--hair); }
.bud .ticks20 i.u { background: var(--ink-2); }
.bud .ticks20 i.ov { background: var(--red); }
.bud .ticks20.na i { background: transparent; border-bottom: 1px dashed var(--hair-2); height: 10px; }
.svc { display: grid; gap: 0; border: 1px solid var(--hair); border-radius: var(--r2); background: var(--well); }
.svc > div { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; font-size: 12.5px; }
.svc > div + div { border-top: 1px solid var(--hair); }
.svc .mono { font-size: 11.5px; color: var(--ink-3); }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(2px);
  display: grid; justify-items: center; align-items: start; padding-top: 96px; animation: fade var(--t) var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(-4px) scale(.995); } to { opacity: 1; transform: none; } }
.pal { width: 600px; max-width: calc(100vw - 48px); background: var(--s-3); border-radius: var(--r3); box-shadow: var(--shadow-pop); overflow: hidden; animation: rise var(--t-slow) var(--ease); }
.pal-in { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.pal-in input { flex: 1; border: 0; background: transparent; font-size: 15px; outline: none; color: var(--ink); caret-color: var(--amber); }
.pal-in .ctx { font: 500 10.5px/1 var(--f-mono); color: var(--ink-3); border: 1px solid var(--hair-2); padding: 4px 6px; border-radius: var(--r1); white-space: nowrap; }
.pal-list { max-height: 420px; overflow: auto; padding: 6px 0 8px; }
.pal-g { padding: 10px 16px 4px; }
.pal-i { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px; align-items: center; height: 36px; padding: 0 16px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; position: relative; }
.pal-i .d { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
.pal-i em { font-style: normal; color: var(--amber); font-weight: 700; }
.pal-i[aria-selected="true"] { background: var(--s-4); color: var(--ink); }
.pal-i[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--amber); }
.pal-i svg { color: var(--ink-3); }
.pal-f { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--hair); background: var(--s-2); font-size: 11.5px; color: var(--ink-3); }
.pal-f span { display: inline-flex; gap: 6px; align-items: center; }
.pal-empty { padding: 24px 16px; color: var(--ink-3); font-size: 13px; }
.dlg { width: 480px; max-width: calc(100vw - 48px); background: var(--s-3); border-radius: var(--r3); box-shadow: var(--shadow-pop); overflow: hidden; animation: rise var(--t-slow) var(--ease); margin-top: 60px; }
.dlg-h { padding: 18px 20px 6px; display: flex; align-items: center; gap: 10px; }
.dlg-h h2 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.dlg-b { padding: 4px 20px 16px; font-size: 13.5px; line-height: 21px; color: var(--ink-2); }
html[lang="zh-CN"] .dlg-b { line-height: 23px; }
.dlg-shift { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; margin: 14px 0 4px; }
.dlg-shift > div { border: 1px solid var(--hair-2); border-radius: var(--r2); padding: 8px 10px; font-size: 12.5px; }
.dlg-shift .from { border-color: var(--teal-ln); }
.dlg-shift .to { border-color: var(--amber-ln); background: var(--amber-bg); }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--hair); background: var(--s-2); }
.sheet { width: 820px; max-width: calc(100vw - 48px); background: var(--s-3); border-radius: var(--r3); box-shadow: var(--shadow-pop); overflow: hidden; animation: rise var(--t-slow) var(--ease); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--hair); }
.sheet-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet-b { display: grid; grid-template-columns: repeat(3, 1fr); }
.sheet-b > div { padding: 14px 20px 18px; }
.sheet-b > div + div { border-left: 1px solid var(--hair); }
.sk-r { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px dashed var(--hair); }
.sk-r:last-child { border-bottom: 0; }
.toast { position: fixed; right: calc(var(--insp) + 16px); bottom: calc(var(--foot) + 14px); z-index: 60; display: flex; gap: 10px; align-items: center; padding: 9px 14px; background: var(--ink); color: var(--ink-inv); border-radius: var(--r2); font-size: 12.5px; box-shadow: var(--shadow-pop); animation: rise var(--t) var(--ease); max-width: 440px; }

/* tick animation for live readouts */
.tickv { display: inline-block; }
.tickv.flip { animation: tick var(--t-fast) var(--ease); }
@keyframes tick { from { opacity: .45; transform: translateY(-2px); } to { opacity: 1; transform: none; } }

/* shot mode & reduced motion */
.shot *, .shot *::before, .shot *::after { animation: none !important; transition: none !important; caret-color: transparent !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 1280 × 800 */
@media (max-width: 1360px) {
  :root { --rail: 200px; --insp: 292px; }
  .top-mid { padding: 0 var(--s5); }
  .cmdk .recent { display: none; }
  .pad { padding: var(--s5) var(--s6) var(--s6); }
  .wk-h, .sealband, .nav40 { padding-left: var(--s6); padding-right: var(--s6); }
  .crumb .cp, .crumb .sep { display: none; }
  .passage { padding: var(--s4) var(--s5) var(--s6) var(--s10); }
  .item { padding: var(--s4) var(--s6) var(--s6) var(--s5); }
  .para { font-size: 15.5px; line-height: 25px; margin-bottom: 12px; }
  .stem { font-size: 15.5px; }
  .opt { font-size: 14.5px; }
  .next-b { grid-template-columns: minmax(0, 1fr) 248px; }
  .next-main h2 { font-size: 23px; }
  .cmp-side { gap: 6px 14px; }
  .anki-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .anki-two { grid-template-columns: 1fr !important; gap: 0 !important; }
  .nrow { grid-template-columns: 22px minmax(0, 1.3fr) minmax(0, .9fr) 92px 150px; }
  .sb-ro { padding: 0 12px; }
  .sb-t .ml { display: none; }
  .skrow { grid-template-columns: 140px minmax(0, 1fr) 40px; }
  .cellbar i { width: 10px; }
  .headline .hv { font-size: 38px; }
  .rail-h .ml + .ml { display: none; }
  .verdict { grid-template-columns: 1.1fr .9fr .7fr 1.2fr; }
  .verdict > div { padding-left: 10px; padding-right: 8px; }
  .modes .mk3 { display: none; }
  .reply-f { white-space: normal; }
  .foot { gap: var(--s3); }
  .foot .lampi .mono.addr, .foot .right .lbl { display: none; }
  .clockwrap { grid-template-columns: 132px minmax(0, 1fr); gap: 10px; }
  .clockwrap svg { width: 132px; height: 132px; }
  .kv { grid-template-columns: 84px minmax(0, 1fr); }
  .caps, .capsh { grid-template-columns: repeat(5, 26px); }
  .reg td, .reg th { padding-right: 8px; }
  .reg .md { font-size: 11px; }
  .reg .tag { font-size: 10.5px; padding: 0 5px; }
  .verdict .v { font-size: 14px; }
  .verdict .v.bad svg { display: none; }
}
@media (max-height: 820px) {
  .wk-h { height: 48px; }
  .sealband { height: 58px; }
  .q-item { padding-top: 5px; padding-bottom: 5px; }
}
</style>

<script>
(function () {

/* ------------------------------------------------------------------ state */

};

function T(zh, en) { return S.lang === 'zh' ? zh : en; }
function $(s, r) { return (r || document).querySelector(s); }

/* ------------------------------------------------------------------ routes / channels */

/* marks are stored as character offsets per paragraph, so they survive every re-render */
function markedText(text, marks) {
  if (!marks || !marks.length) return esc(text);
  var out = '', at = 0;
  marks.slice().sort(function (a, b) { return a.s - b.s; }).forEach(function (m) {
    if (m.s < at) return;
    out += esc(text.slice(at, m.s)) + '<mark class="mk">' + esc(text.slice(m.s, m.e)) + '</mark>'; at = m.e;
  });
  return out + esc(text.slice(at));
}
function passage(opts) {
  opts = opts || {};
  var ps = PARAS.map(function (p, i) {
    var h = opts.marks ? markedText(p, opts.marks.filter(function (m) { return m.p === i; })) : p;
    if (opts.evidence && i === 1) h = h.replace('Engineers will replace two of the four main pumps', '<span class="ev">Engineers will replace <b>two of the four</b> main pumps</span>');
    return '<p class="para"><span class="pn" aria-hidden="true">' + (i + 1) + '</span><span class="pt" data-p="' + i + '">' + h + '</span></p>';
  }).join('');
  return '<article class="passage" id="passage" aria-label="' + T('文章', 'Passage') + '">' +
    '<div class="src">' + (opts.src || '') + '</div>' +
    '<h2 lang="en">Notice: Temporary Closure of the North Pump Station</h2>' +

}

function focusKey() { // remember what had focus so a re-render does not drop keyboard users to <body>
  var a = document.activeElement;

  for (var i = 0; i < FOCUS_KEYS.length; i++) { var k = FOCUS_KEYS[i], v = a.getAttribute(k); if (v) return '[' + k + '="' + v + '"]' + (a.hasAttribute('data-av') ? '[data-av="' + a.getAttribute('data-av') + '"]' : ''); }
  return null;
}
function render() {
  var fk = focusKey();

  root.setAttribute('data-theme', S.theme);

  root.classList.toggle('shot', S.shot);

}

    return;
  }
  if (S.sheet) { if (k === 'Escape' || k === '?') { S.sheet = false; renderLayer(); } else if (k === 'Tab') e.preventDefault(); return; }
  if (S.route === 'anki' && (e.ctrlKey || e.metaKey) && k === 'Enter') { e.preventDefault(); act('accept'); return; }
  if (typing) return;
  if (e.altKey && k.toLowerCase() === 't') { e.preventDefault(); setTheme(S.theme === 'dark' ? 'light' : 'dark'); return; }
  if (e.altKey && k.toLowerCase() === 'l') { e.preventDefault(); setLang(S.lang === 'zh' ? 'en' : 'zh'); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === '?') { S.sheet = true; renderLayer(); return; }
  if (S.chord) {
    S.chord = false; clearTimeout(chordT); $('#chordind').textContent = '';
    var r = ROUTES.filter(function (x) { return x.k.toLowerCase() === k.toLowerCase(); })[0];
    if (r) { if (S.route === 'assess' && r.id !== 'assess') sealedNotice(); else go(r.id); return; }
  }
  if (k === 'g' || k === 'G') { S.chord = true; $('#chordind').innerHTML = '<span class="chord">G …</span>'; chordT = setTimeout(function () { S.chord = false; $('#chordind').textContent = ''; }, 1200); return; }
  var up = k.toUpperCase(), idx = '1234'.indexOf(k);
  // roving radio group: arrows move within the options when one has focus
  if (a && a.matches('.opt') && (k === 'ArrowDown' || k === 'ArrowUp')) {
    e.preventDefault(); var attr = a.hasAttribute('data-opt') ? 'data-opt' : 'data-aopt', cur = 'ABCD'.indexOf(a.getAttribute(attr));
    return selectOpt('ABCD'[(cur + (k === 'ArrowDown' ? 1 : 3)) % 4], true);
  }
  if (S.route === 'practice') {
    if ('ABCD'.indexOf(up) >= 0 && k.length === 1) return selectOpt(up);
    if (idx >= 0) return selectOpt('ABCD'[idx]);
    if (k === 'Enter' && enterIsFree()) { e.preventDefault(); if (a && a.matches('[data-opt]') && !S.practice.sel) return selectOpt(a.getAttribute('data-opt')); return submitPractice(); }
    if (up === 'H') return act('hint');
    if (up === 'S') return act('skip');
    if (up === 'M') return doMark();
  } else if (S.route === 'assess') {
    if ('ABCD'.indexOf(up) >= 0 && k.length === 1) return selectOpt(up);
    if (idx >= 0) return selectOpt('ABCD'[idx]);
    if (k === 'Enter' && enterIsFree()) { e.preventDefault(); if (a && a.matches('[data-aopt]') && !S.assess.sel[S.assess.cur]) return selectOpt(a.getAttribute('data-aopt')); return act('aconfirm'); }
    if (k === 'ArrowLeft') return act('aprev');
    if (k === 'ArrowRight') return act('anext');
  } else if (S.route === 'feedback') {
    if ('123'.indexOf(k) >= 0 && k.length === 1) return setMode(['explain', 'probe', 'lesson']['123'.indexOf(k)]);
    if (a && a.matches('[role=tab]') && (k === 'ArrowLeft' || k === 'ArrowRight')) { var ms = ['explain', 'probe', 'lesson'], mi = ms.indexOf(S.fb.mode); setMode(ms[(mi + (k === 'ArrowRight' ? 1 : 2)) % 3]); var tb = $('#tab-' + S.fb.mode); if (tb) tb.focus(); return; }
    if (up === 'N') return go('anki');
    if (k === 'Enter' && enterIsFree()) { e.preventDefault(); return act('nextitem'); }
  } else if (S.route === 'today') {
    if (k === 'Enter' && enterIsFree()) return go('practice');
  } else if (S.route === 'anki') {
    if (up === 'F') { S.anki.face = S.anki.face === 'front' ? 'back' : 'front'; render(); }
  }
});

/* ------------------------------------------------------------------ live clocks (frozen in ?shot=1) */
function flip(el, txt) { if (!el || el.textContent === txt) return; el.textContent = txt; el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
if (!S.shot) setInterval(function () {
  if (S.route === 'practice' && !S.dlg) { S.practice.elapsed++; flip($('#pclock'), mmss(S.practice.elapsed)); }
  // the assessment run clock never pauses, wherever you are
  var A = S.assess;
  if (A.left > 0) A.left--;
  if (A.item < 90) A.item++;
  else if (A.to.indexOf(A.cur) < 0 && A.answered.indexOf(A.cur) < 0) { // item deadline: a late answer is ignored, the item is recorded as timed out
    A.to.push(A.cur); delete A.sel[A.cur];
    if (S.route === 'assess') { toast(T('第 ' + A.cur + ' 题超时，已记录', 'Item ' + A.cur + ' timed out and was recorded')); assessGo(A.cur + 1); }
    else { A.cur = Math.min(40, A.cur + 1); A.item = 0; }
    return;
  }
  if (S.route === 'assess') {
    flip($('#rclock'), mmss(A.left));
    var el2 = $('#rleft2'); if (el2) el2.textContent = mmss(A.left);
    var el3 = $('#relapsed'); if (el3) el3.textContent = mmss(3600 - A.left);
    var ic = $('#iclock'); if (ic) ic.textContent = mmss(A.item);
    var arc = $('#arc'); if (arc) { var C = 2 * Math.PI * 60; arc.setAttribute('stroke-dasharray', (C * A.item / 90).toFixed(1) + ' ' + C.toFixed(1)); }
  }
}, 1000);

window.addEventListener('hashchange', route);
if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/today');
persist();
route();
/* Review hook (screenshots/design review only; not part of the brief's contract):
   ?open=cmd[&q=text] opens the command bar · ?open=keys the shortcut sheet · ?open=hint the hint gate (practice)
   ?open=assisted shows practice after the hint was opened · ?card=dark-phone-front sets the Anki preview · ?revoke=1 revokes consent */
(function () {
  var cd = qs.get('card'); if (cd) { cd.split('-').forEach(function (v) { if (v === 'dark' || v === 'light') S.anki.ctheme = v; if (v === 'phone' || v === 'desktop') S.anki.width = v; if (v === 'front' || v === 'back') S.anki.face = v; }); render(); }
  if (qs.get('revoke') === '1') { S.consent = false; S.ledger.push({ t: '11-13 10:31', kind: 'withhold' }); render(); }
  var o = qs.get('open');
  if (o === 'cmd') { S.pal = { q: qs.get('q') || '', i: 0 }; renderLayer(); }
  else if (o === 'keys') { S.sheet = true; renderLayer(); }
  else if (o === 'hint' && S.route === 'practice') { S.dlg = 'hint'; renderLayer(); }
  else if (o === 'assisted' && S.route === 'practice') { closeHint(true); selectOpt('C'); }
})();
})();
</script>
